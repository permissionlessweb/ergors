---
# Embedding Inference Provider SDL
# Deploys SentenceTransformer-based embedding model on Akash Network
# Compatible with OpenAI /v1/embeddings and Ollama /api/embeddings APIs
#
# Default model: all-MiniLM-L6-v2 (384 dimensions, ~80MB)
# For larger models, adjust resources and set EMBEDDING_MODEL env var
#
# Usage with ergors:
#   ergors deploy create --sdl sdls/embeddings/embedding-provider.yml \
#     --var EMBEDDING_MODEL=all-MiniLM-L6-v2

version: "2.0"
services:
  embedding:
    image: ${EMBEDDING_IMAGE:-ghcr.io/ergors/embedding-provider:latest}
    expose:
      - port: 8080
        as: 8080
        to:
          - global: true
    env:
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-all-MiniLM-L6-v2}
      - PORT=8080
      - HOST=0.0.0.0
      - MAX_BATCH_SIZE=${MAX_BATCH_SIZE:-256}
    params:
      storage:
        cache:
          mount: /home/embedding/.cache
          readOnly: false

profiles:
  compute:
    embedding:
      resources:
        cpu:
          units: 4
        memory:
          size: 4Gi
        storage:
          - size: 2Gi
          - name: cache
            size: 10Gi
            attributes:
              persistent: true
              class: beta3
        gpu:
          units: 0
  placement:
    dcloud:
      pricing:
        embedding:
          denom: uakt
          amount: 100000

deployment:
  embedding:
    dcloud:
      profile: embedding
      count: 1
