---
# Embedding Inference Provider SDL (GPU-accelerated)
# For larger embedding models that benefit from GPU acceleration
#
# Recommended models:
#   - Qwen3-Embedding-0.6B (1024 dims)
#   - bge-large-en-v1.5 (1024 dims)
#   - jina-embeddings-v3 (1024 dims)
#
# Usage with ergors:
#   ergors deploy create --sdl sdls/embeddings/embedding-provider-gpu.yml \
#     --var EMBEDDING_MODEL=BAAI/bge-large-en-v1.5

version: "2.0"
services:
  embedding:
    image: ${EMBEDDING_IMAGE:-ghcr.io/ergors/embedding-provider:latest-gpu}
    expose:
      - port: 8080
        as: 8080
        to:
          - global: true
    env:
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-BAAI/bge-large-en-v1.5}
      - PORT=8080
      - HOST=0.0.0.0
      - MAX_BATCH_SIZE=${MAX_BATCH_SIZE:-512}
    params:
      storage:
        cache:
          mount: /home/embedding/.cache
          readOnly: false

profiles:
  compute:
    embedding:
      resources:
        cpu:
          units: 8
        memory:
          size: 16Gi
        storage:
          - size: 5Gi
          - name: cache
            size: 50Gi
            attributes:
              persistent: true
              class: beta3
        gpu:
          units: 1
          attributes:
            vendor:
              nvidia:
                - model: rtx4090
                  ram: 24Gi
                - model: a100
                  ram: 40Gi
  placement:
    dcloud:
      pricing:
        embedding:
          denom: uakt
          amount: 500000

deployment:
  embedding:
    dcloud:
      profile: embedding
      count: 1
