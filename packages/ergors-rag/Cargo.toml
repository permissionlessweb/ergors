[package]
name = "ergors-rag"
version = "0.1.0"
edition = "2021"

[dependencies]
# Core deps
anyhow = "1.0"
thiserror = "2.0"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
async-trait = "0.1"
futures = "0.3"

# Storage
cnidarium = "0.84.0"

# Vector index
hnsw_rs = "0.3"

# Serialization & hashing
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
blake3 = "1.5"
uuid = { version = "1.0", features = ["v4", "serde"] }
bytemuck = "1.14"

# Protobuf (for timestamps, etc.)
pbjson-types = "0.7"
chrono = "0.4"

# Embeddings (optional, feature-gated)
candle-core = { version = "0.8", optional = true }
candle-nn = { version = "0.8", optional = true }
candle-transformers = { version = "0.8", optional = true }
tokenizers = { version = "0.20", optional = true }
hf-hub = { version = "0.3", optional = true, features = ["tokio"] }
reqwest = { version = "0.11", optional = true, features = ["json", "rustls-tls"] }
serde_json = "1.0"

[features]
default = []
# Generic Candle embedder (BGE, Qwen, E5, etc.)
candle = ["candle-core", "candle-nn", "candle-transformers", "tokenizers", "hf-hub"]
# OpenAI API embedder (requires OPENAI_API_KEY env var)
openai = ["reqwest"]

[dev-dependencies]
tempfile = "3.8"
