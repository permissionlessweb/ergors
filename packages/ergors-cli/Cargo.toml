[package]
name = "ergors-cli"
version = "0.1.0"
edition = "2021"
authors = ["CW-Agent Contributors"]
description = "CLI client for ERGORS node management"
license = "MIT"

[[bin]]
name = "ergors-cli"
path = "src/main.rs"

[dependencies]
ho-std = { workspace = true, features = ["rpc"] }

# CLI framework
clap = { workspace = true, features = ["derive", "env"] }
camino = { workspace = true }

# gRPC client
tonic = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }

# Async
futures = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Utils
anyhow = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
dirs = { workspace = true }
hex = { workspace = true }
uuid = { workspace = true }
