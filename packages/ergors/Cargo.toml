[package]
name = "ergors"
version = "0.1.0"
edition = "2021"
authors = ["CW-Agent Contributors"]
description = "Minimal prompt capture service with Cnidarium storage"
license = "MIT"

[features]
default = ["cw","discord","rlm"]
cw = []
testing = []
discord = ["serenity", "poise", "html2text"]
rlm = ["ergors-rlm"]
github-ingest = ["githem-core"]


[[bin]]
name = "ergors"
path = "src/main.rs"

[dependencies]
zk-headstash  = { workspace = true }
ho-std  = { workspace = true, features = ["rpc"] }
ergors-rag = { path = "../ergors-rag", features = ["openai"] }
ergors-rlm = { path = "../ergors-rlm", optional = true }
akash-deploy-rs = { workspace = true }
anyhow = { workspace = true }
argon2 = { workspace = true }
async-stream = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
base64 = { workspace = true }
bip32 = { workspace = true }
bytes = { workspace = true }
camino = { workspace = true }
chacha20poly1305 = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true, features = ["derive", "env"] }
cnidarium = { workspace = true }
commonware-codec = { workspace = true }
cosmwasm-std = { workspace = true }
commonware-cryptography = { workspace = true }
commonware-p2p = { workspace = true }
cosmrs = { workspace = true }
commonware-runtime = { workspace = true }
futures = { workspace = true }
governor = { workspace = true }
hex = { workspace = true }
layer-climb = { workspace = true }
layer-climb-proto = { workspace = true }
http-body-util = { workspace = true }
pbjson-types = { workspace = true }
prost = { workspace = true }
rand = { workspace = true }
rcgen = { workspace = true }
regex = { workspace = true }
reqwest = { workspace = true }
rustls = { workspace = true }
sha2 = { workspace = true }
rpassword = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
time = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
tonic = { workspace = true }
toml = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
serde_yaml = { workspace = true }
mimalloc = { version = "0.1", default-features = false }

# Discord gateway (optional)
serenity = { version = "0.12", optional = true, default-features = false, features = ["client", "gateway", "rustls_backend", "model", "cache"] }
poise = { version = "0.6", optional = true }
html2text = { version = "0.6", optional = true }

# GitHub ingestion (optional)
githem-core = { version = "0.4", optional = true }
# githem-core = { path = "../../../githem/core", optional = true }  # Use for local dev

# Unix-specific dependencies
[target.'cfg(unix)'.dependencies]
termios = "0.3"
libc = "0.2"

[dev-dependencies]
tokio-test = "0.4"
tempfile = { workspace = true }