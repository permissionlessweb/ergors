[package]
name = "ho-std"
version = "0.1.0"
edition = "2021"
description = "ERGORS: Life Creativity Engine - Minimal Rust orchestrator for P2P AI agent coordination"
authors = ["CW-Ho Team"]
license = "MIT OR Apache-2.0"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["grpc-transport", "cw", "rpc"]
std = ["prost/std"]
cw = ["cosmwasm-vm"] # cosmwasm vm features
rpc = []
grpc = ["std", "tonic", "tonic-prost"]
grpc-transport = ["grpc", "tonic/transport"]

[dependencies]
argon2 = "0.5"
anyhow = { workspace = true }
ark-ff = { workspace = true, default-features = false }
serde_with = {workspace = true, features = ["hex"]}
async-trait = { workspace = true }
# Network and HTTP
axum = { workspace = true }
base64 = { workspace = true }
bech32 = { workspace = true }
bip32 = "0.5"
bip39 = { version = "2.1", features = ["rand"] }
blake2b_simd = { workspace = true }
bytes = { workspace = true }
camino = { workspace = true }
chrono = { workspace = true }
cnidarium  = { workspace = true }
commonware-codec = { workspace = true }
commonware-cryptography = { workspace = true }
chacha20poly1305 = {workspace = true}
commonware-p2p = { workspace = true }
cosmwasm-std = { workspace = true }
decaf377 = { workspace = true, features = ["r1cs"], default-features = true }
decaf377-fmd = { workspace = true }
decaf377-ka = { workspace = true }
decaf377-rdsa = { workspace = true }
directories = { workspace = true }
dirs = { workspace = true }
dotenvy = { workspace = true }
ed25519-consensus = { workspace = true }
fmt = { workspace = true }
futures = { workspace = true }
futures-util = { workspace = true }
git2 = { workspace = true }
hex = { workspace = true }
hmac = "0.12.0"
http-body-util = { workspace = true }
k256 = { version = "0.13", features = ["ecdsa"] }
ibc-proto = { workspace = true, default-features = false, features = ["server"] }
jmt = { workspace = true }
pbjson-types = { workspace = true }
pbkdf2 = "0.12.0"
penumbra-sdk-tct = { workspace = true }
prost = { workspace = true }
rand = { workspace = true }
rand_core = { workspace = true }
reqwest = { workspace = true }
ripemd = "0.1"
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = "0.9"
sha2 = { workspace = true }
ssh-key = { workspace = true }
termion = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
tonic = { version = "0.14.1", optional = true, default-features = false, features = ["codegen"] }
tonic-prost = { version = "0.14.1", optional = true, default-features = false }
tower = "0.5"
tracing = "0.1"
uuid = { version = "1.10", features = ["v4", "serde"] }
zeroize = { version = "1.8", features = ["derive"] }
cosmwasm-vm = { workspace = true, optional = true, features = ["stargate"] }


[dev-dependencies]
proptest = { workspace = true }
tempfile = { workspace = true }
tokio-test = "0.4"
