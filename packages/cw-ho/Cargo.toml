[package]
name = "ergors"
version = "0.1.0"
edition = "2021"
authors = ["CW-Agent Contributors"]
description = "Minimal prompt capture service with Cnidarium storage"
license = "MIT"

[features]
default = ["cw"]
cw = []
testing = []


[[bin]]
name = "ergors"
path = "src/main.rs"

[dependencies]
zk-headstash  = { workspace = true }
ho-std  = { workspace = true, features = ["rpc"] }
ergors-rag = { path = "../ergors-rag", features = ["openai"] }
anyhow = { workspace = true }
async-stream = { workspace = true }
axum = { workspace = true }
base64 = { workspace = true }
bip32 = { workspace = true }
bytes = { workspace = true }
camino = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true, features = ["derive", "env"] }
cnidarium = { workspace = true }
commonware-codec = { workspace = true }
cosmwasm-std = { workspace = true }
commonware-cryptography = { workspace = true }
commonware-p2p = { workspace = true }
cosmrs = { workspace = true }
commonware-runtime = { workspace = true }
futures = { workspace = true }
governor = { workspace = true }
hex = { workspace = true }
layer-climb = { workspace = true }
layer-climb-proto = { workspace = true }
http-body-util = { workspace = true }
pbjson-types = { workspace = true }
prost = { workspace = true }
rand = { workspace = true }
rcgen = { workspace = true }
regex = { workspace = true }
reqwest = { workspace = true }
rustls = { workspace = true }
sha2 = { workspace = true }
rpassword = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
time = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
tonic = { workspace = true }
toml = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
serde_yaml = { workspace = true }

[dev-dependencies]
tokio-test = "0.4"
tempfile = { workspace = true }