// proto/ergors/storage/v1/storage.proto

syntax = "proto3";

package ergors.storage.v1;
 

import "google/protobuf/timestamp.proto";

// Single encrypted API key for a provider
message EncryptedApiKey {
  string provider_name = 1;
  bytes encrypted_key = 2;  // Encrypted with custody password-derived key
  google.protobuf.Timestamp encrypted_at = 3;
  string encryption_method = 4;  // e.g., "argon2id-chacha20poly1305-v1"
  bytes nonce = 5;  // Encryption nonce
}

// Collection of encrypted API keys (stored in Cnidarium)
message EncryptedApiKeyStore {
  // Version for migration support
  uint32 version = 1;
  // All encrypted provider API keys
  repeated EncryptedApiKey keys = 2;
  // Metadata
  google.protobuf.Timestamp created_at = 3;
  google.protobuf.Timestamp updated_at = 4;
  // KDF salt (shared for all keys in this store)
  bytes kdf_salt = 5;
  // KDF params (JSON encoded)
  string kdf_params = 6;
}

// Encrypted node identity for secure private key storage
// The private key is encrypted using password-based key derivation (Argon2 + ChaCha20Poly1305)
message EncryptedNodeIdentity {
  // The public key (always stored in plaintext for identification)
  bytes public_key = 1;
  // The encrypted private key (ChaCha20Poly1305 encrypted blob)
  bytes encrypted_private_key = 2;
  // Encryption metadata
  google.protobuf.Timestamp encrypted_at = 3;
  // Encryption method identifier (e.g., "argon2id-chacha20poly1305-v1")
  string encryption_method = 4;
  // Salt for key derivation (stored separately from encrypted blob for flexibility)
  bytes kdf_salt = 5;
  // Key derivation parameters (JSON encoded for forward compatibility)
  // Contains: memory_cost, time_cost, parallelism, output_length
  string kdf_params = 6;
  // Version for migration support
  uint32 version = 7;
  // Optional node metadata (user, host, ports etc.)
  optional NodeIdentityMetadata metadata = 8;
}

// Non-sensitive metadata about the node identity
message NodeIdentityMetadata {
  string user = 1;
  string host = 2;
  uint32 p2p_port = 3;
  uint32 api_port = 4;
  uint32 ssh_port = 5;
  string node_type = 6;
  string os = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp last_used = 9;
}

// Custody backend configuration
message NodeIdentityCustodyConfig {
  // Backend type: "plaintext", "password_encrypted", "node_key_encrypted", "threshold", "remote"
  string backend = 1;
  // Whether to cache decrypted keys in memory
  bool cache_keys = 2;
  // TTL for cached keys in seconds (0 = no expiry)
  uint64 cache_ttl_secs = 3;
  // Path to encrypted identity file
  string identity_path = 4;
  // Remote custody endpoint (for remote backend)
  string remote_endpoint = 5;
}

message ProviderMetadata {
  string name = 1;
  string base_url = 2;
  repeated string models = 3;
  int32 priority = 4;
  bool enabled = 5;
}

// Storage-specific types
message StorageQuery {
  optional string session_id = 1;
  optional string user_id = 2;
  optional google.protobuf.Timestamp start_time = 3;
  optional google.protobuf.Timestamp end_time = 4;
  optional uint32 limit = 5;
  optional uint32 offset = 6;
  map<string, string> filters = 7;
}

message StorageConfig {
  string data_dir = 1;
  uint32 max_size_mb = 2;
  bool enable_compression = 3;
}


message StorageIndex {
  string key = 1;
  string value = 2;
  google.protobuf.Timestamp created_at = 3;
}

message StorageSnapshot {
  string id = 1;
  google.protobuf.Timestamp created_at = 2;
  string state_root = 3;
  uint64 version = 4;
  map<string, bytes> data = 5;
}

message StorageMetrics {
  uint64 total_entries = 1;
  uint64 storage_size_bytes = 2;
  uint64 index_size_bytes = 3;
  google.protobuf.Timestamp last_compaction = 4;
  double fragmentation_ratio = 5;
}

// Keep existing API types for backward compatibility
message QueryRequest {
  optional string session_id = 1;
  optional string user_id = 2;
  optional google.protobuf.Timestamp start_time = 3;
  optional google.protobuf.Timestamp end_time = 4;
  optional uint32 limit = 5;
}

message StorageHealthResponse {
  string status = 1;
  string version = 2;
  uint64 uptime_seconds = 3;
  string storage_status = 4;
  optional string network_status = 5;
}

message ErrorResponse {
  string error = 1;
  string code = 2;
  google.protobuf.Timestamp timestamp = 3;
  // Stack trace for debugging
  optional string stack_trace = 4;
}

// Minimal operation record for request/response tracking
message OperationRecord {
  string id = 1;
  string operation_type = 2; // e.g., "prompt", "bootstrap", "health"
  string endpoint = 3; // API path
  bytes request = 4; // Serialized request (JSON or proto)
  optional bytes response = 5; // Serialized response
  optional ErrorResponse error = 6;
  google.protobuf.Timestamp started_at = 7;
  optional google.protobuf.Timestamp completed_at = 8;
  optional string session_id = 9;
}

// ========================================
// Generic Encrypted Secret Storage
// ========================================

// Unified encrypted secret type for gateway tokens, API keys, etc.
// Uses node identity key encryption (no password required at runtime).
// Access is audited via SecretAccessLog.
message EncryptedSecret {
  // Unique identifier (e.g., "discord_bot_token", "telegram_bot_token")
  string secret_id = 1;
  // Category for grouping (e.g., "gateway_token", "api_key", "credential")
  string secret_type = 2;
  // Human-readable label
  string label = 3;
  // ChaCha20Poly1305 encrypted value (encrypted with node identity key)
  bytes encrypted_value = 4;
  // Encryption nonce (unique per encryption)
  bytes nonce = 5;
  // Encryption method identifier (e.g., "node_key_chacha20poly1305_v1")
  string encryption_method = 6;
  // When the secret was stored
  google.protobuf.Timestamp created_at = 7;
  // When the secret was last accessed (decrypted)
  google.protobuf.Timestamp last_accessed_at = 8;
  // Number of times the secret has been accessed
  uint64 access_count = 9;
  // Optional metadata (e.g., associated gateway_id, expiry info)
  map<string, string> metadata = 10;
}

// Collection of encrypted secrets (stored in Cnidarium)
message EncryptedSecretStore {
  uint32 version = 1;
  repeated EncryptedSecret secrets = 2;
  google.protobuf.Timestamp created_at = 3;
  google.protobuf.Timestamp updated_at = 4;
}

// Audit log entry for secret access
// Stored in Cnidarium for immutable audit trail
message SecretAccessLog {
  // Which secret was accessed
  string secret_id = 1;
  // When it was accessed
  google.protobuf.Timestamp accessed_at = 2;
  // Which component accessed it (e.g., "discord_gateway", "grpc_handler")
  string accessor = 3;
  // Why it was accessed (e.g., "gateway_start", "config_reload", "health_check")
  string purpose = 4;
  // Operation result
  bool success = 5;
  // Error message if failed
  string error = 6;
}

