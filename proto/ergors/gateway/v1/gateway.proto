syntax = "proto3";
package ergors.gateway.v1;

option go_package = "github.com/ho-rs/ho-proto-go/ergors/gateway/v1;gatewayv1";

// Gateway configuration stored in Cnidarium
message GatewayConfig {
  string gateway_id = 1;
  string gateway_type = 2;  // "discord", "nostr", "element", "bluetooth"
  bool enabled = 3;
  map<string, string> settings = 4;  // Type-specific settings
}

// Incoming message from any gateway
message GatewayMessage {
  string gateway_id = 1;
  string channel_id = 2;      // Discord channel, Nostr relay, etc.
  string sender_id = 3;       // User identifier
  string sender_name = 4;     // Display name
  string content = 5;         // Message text
  int64 timestamp = 6;
  map<string, string> metadata = 7;  // Platform-specific extras

  // For threading/context
  string reply_to_id = 8;     // If replying to previous message
  string thread_id = 9;       // For threaded conversations
}

// Response to send back through gateway
message GatewayResponse {
  string gateway_id = 1;
  string channel_id = 2;
  string recipient_id = 3;
  string content = 4;
  string reply_to_id = 5;     // Original message ID to reply to

  // Optional rich content
  repeated EmbedField embeds = 6;
  repeated string attachments = 7;
}

message EmbedField {
  string title = 1;
  string value = 2;
  bool inline = 3;
}

// Discord-specific configuration
message DiscordGatewayConfig {
  string bot_token = 1;       // Encrypted in storage
  repeated string allowed_guild_ids = 2;  // Empty = all guilds
  repeated string allowed_channel_ids = 3;
  bool respond_to_mentions = 5;
  bool respond_to_dms = 6;
}

// Nostr-specific configuration (future)
message NostrGatewayConfig {
  string private_key = 1;     // Encrypted nsec
  repeated string relay_urls = 2;
  repeated string allowed_pubkeys = 3;
}

// Gateway session tracking (for per-thread conversations)
message GatewaySession {
  string session_id = 1;
  string gateway_id = 2;
  string thread_id = 3;       // Discord thread/channel ID
  string user_id = 4;         // Primary user for this session
  int64 created_at = 5;
  int64 last_message_at = 6;
  int32 message_count = 7;
}

// ============================================
// Guild-scoped RAG Configuration
// ============================================

// RAG operation mode for guild
enum RagMode {
  RAG_MODE_UNSPECIFIED = 0;
  RAG_MODE_STATIC = 1;   // Current HNSW embeddings
  RAG_MODE_RLM = 2;      // Agentic RLM
  RAG_MODE_HYBRID = 3;   // RLM with RAG fallback
}

// Per-guild RAG configuration for Discord
message GuildRagConfig {
  string guild_id = 1;

  // Role ID that can perform ingestion (empty = guild owner only)
  string admin_role_id = 2;

  // Whether RAG context is automatically injected into prompts
  bool auto_context_enabled = 3;

  // Maximum chunks to retrieve for context (default: 3)
  uint32 max_context_chunks = 4;

  // Minimum similarity threshold (0.0-1.0, default: 0.5)
  float min_similarity = 5;

  // Optional: dedicated embedder endpoint (overrides global)
  string embedder_endpoint = 6;

  // Stats (updated on ingestion)
  // NOTE: These are approximate counters - concurrent ingestions may race.
  // For precise counts, query the actual RAG storage directly.
  uint32 total_documents = 7;
  uint32 total_chunks = 8;
  int64 last_ingestion_at = 9;

  // RLM configuration
  RagMode mode = 10;
  uint32 rlm_max_iterations = 11;      // default: 10
  uint32 rlm_max_sub_calls = 12;       // default: 50
  reserved 13;                         // was rlm_allowed_models
  string rlm_primary_model = 14;       // Model for root RLM reasoning (e.g. deployment label or "claude-sonnet-4-5-20250929")
  string rlm_sub_model = 15;           // Model for sandboxed llm_query() sub-calls
}

// RAG context retrieved for a prompt
message RagContextResult {
  repeated RagContextChunk chunks = 1;
  string guild_id = 2;
  float query_time_ms = 3;
}

message RagContextChunk {
  string content = 1;
  string source_uri = 2;
  float similarity = 3;
}

// Audit log for guild RAG operations
message GuildRagAuditLog {
  string guild_id = 1;
  string user_id = 2;
  string operation = 3;       // "ingest", "delete", "config_update"
  string source_uri = 4;
  int64 timestamp = 5;
  bool success = 6;
  string message = 7;
}
