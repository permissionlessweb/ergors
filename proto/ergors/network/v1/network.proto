syntax = "proto3";

package ergors.network.v1;

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";
import "git/v1/git.proto";

message Request {
  string request_id = 1;
  google.protobuf.Struct payload = 2;
}

message Response {
  string request_id = 1;
  bool success = 2;
  google.protobuf.Struct payload = 3;
}

// Network Configuration
message NewNetworkConfig {}

// Network Configuration
message NetworkConfig {
  NodeType node_type = 1;
  repeated string bootstrap_peers = 2;
  repeated string known_peers = 3;
  uint32 listen_port = 4;
  string listen_address = 5;
  uint32 connection_timeout_ms = 7;
  bool enable_discovery = 8;
  NetworkLimits limits = 9;
  ChannelConfig channels = 10;
}


// NodeIdentity: Network Node Types
message NodeIdentity {
  string host = 1;
  uint32 p2p_port = 2;
  uint32 api_port = 3;
  string user = 4;
  HostOS os = 5;
  uint32 ssh_port = 6;
  string node_type = 7;
  optional bytes public_key = 8;
  // Bech32-encoded address derived from the node's Ed25519 public key
  // Uses akash prefix by default (akash1...)
  optional string bech32_address = 9;
}



// Network Communication Types
message NetworkMessage {
  oneof message_type {
    NodeAnnounce node_announce = 1;
    TaskCoordination task_coordination = 2;
    SandloopState sandloop_state = 3;
    Request request = 6;
    Response response = 7;
    ergors.git.v1.WorkspaceSync workspace_sync = 8;
    // Key sharing protocol messages (Channel 4)
    KeySharingMessage key_sharing = 9;
  }
}

message ChannelConfig {
  uint32 discovery_buffer = 1;
  uint32 task_buffer = 2;
  uint32 state_buffer = 3;
  uint32 health_buffer = 4;
  // Channel 4: Key sharing protocol buffer
  uint32 key_sharing_buffer = 5;
}

message NodeInfo {
  string node_id = 1;
  string node_type = 2;
  bool online = 3;
  uint64 last_seen = 4;
}

message NodeAnnounce {
  string node_id = 1;
  NodeType role = 2;
  repeated string capabilities = 3;
  string load_factor = 4;
}

// TopologyStatsResponse
message TopologyStatsResponse {
  uint32 max_message_size = 1;
  uint32 max_peers = 2;
  uint64 connection_timeout = 3;
}
// Network Configuration
message NetworkLimits {
  uint32 max_message_size = 1;
  uint32 max_peers = 2;
  uint64 connection_timeout = 3;
}


message TaskCoordination {
  string task_id = 1;
  NodeType from_role = 2;
  NodeType to_role = 3;
  string task_type = 4;
  google.protobuf.Struct payload = 5;
}
  
message SandloopState {
string loop_id = 1;
uint64 iteration = 2;
string phase = 3;
google.protobuf.Struct metrics = 4;
}

enum HostOS {
  HOST_OS_UNSPECIFIED = 0;
  HOST_OS_LINUX = 1;
  HOST_OS_MACOS = 2;
  HOST_OS_WINDOWS = 3;
  HOST_OS_CONTAINER_LINUX = 4;
}


// Network Events
message NetworkEvent {
  oneof event_type {
    PeerAction peer_connected = 1;
    PeerAction peer_disconnected = 2;
    MessageReceived message_received = 3;
    TopologyChanged topology_changed = 4;
    NetworkError error = 5;
  }
}

message PeerAction {
  bytes peer_id = 1;
  NodeInfo node_info = 2;
  string reason = 3;
}


message MessageReceived {
  bytes from = 1;
  NetworkMessage message = 2;
  uint32 channel = 3;
}

message TopologyChanged {
  NetworkTopology topology = 1;
}

// NetworkError: Error structure used from peer network layer
message NetworkError {
  string error = 1;
}

// Basic network topology
message NetworkTopology {
  repeated NodeInfo nodes = 1;
  repeated Connection connections = 2;
}

message Connection {
  string from_node_id = 1;
  string to_node_id = 2;
}

// Basic node types used across all services
enum NodeType {
  NODE_TYPE_UNSPECIFIED = 0;
  NODE_TYPE_COORDINATOR = 1;
  NODE_TYPE_EXECUTOR = 2;
  NODE_TYPE_REFEREE = 3;
  NODE_TYPE_DEVELOPMENT = 4;
}

// ========================================
// Key Sharing & Secret Distribution Types
// ========================================

// Secret sharing mode selection
enum KeySharingMode {
  KEY_SHARING_MODE_UNSPECIFIED = 0;
  KEY_SHARING_MODE_DIRECT = 1;     // 1-to-1 encrypted sharing (ECDH + ChaCha20Poly1305)
  KEY_SHARING_MODE_SHAMIR = 2;     // n-of-m threshold sharing (Shamir Secret Sharing)
}

// Configuration for secret sharing
message SecretSharingConfig {
  KeySharingMode mode = 1;
  // For SHAMIR mode: minimum shares needed to reconstruct
  uint32 threshold = 2;
  // For SHAMIR mode: total shares to generate
  uint32 total_shares = 3;
  // For DIRECT mode: threshold=1, total_shares=1 (implied)
}

// A secret share (works for both Direct and Shamir modes)
message SecretShare {
  // Unique identifier for this share
  string share_id = 1;
  // Share index (1 for direct mode, 1..n for Shamir)
  uint32 index = 2;
  // Encrypted share value (encrypted for recipient's public key)
  bytes encrypted_value = 3;
  // Public key of the intended recipient
  bytes recipient_pubkey = 4;
  // Which API key provider this share is for
  string provider = 5;
  // When this share expires
  google.protobuf.Timestamp expires_at = 6;
  // Which sharing mode was used
  KeySharingMode mode = 7;
  // Feldman VSS commitment (Shamir only, for verification)
  bytes commitment = 8;
  // Sharing config for reconstruction
  SecretSharingConfig config = 9;
}

// Identity challenge for verification (challenge-response authentication)
message IdentityChallenge {
  // Unique challenge identifier
  string challenge_id = 1;
  // Random nonce to be signed
  bytes nonce = 2;
  // Public key being challenged
  bytes challenged_pubkey = 3;
  // When this challenge expires
  google.protobuf.Timestamp expires_at = 4;
}

// Response to an identity challenge
message IdentityChallengeResponse {
  // The challenge being responded to
  string challenge_id = 1;
  // Ed25519 signature over (nonce || timestamp || pubkey)
  bytes signature = 2;
  // Public key that created the signature
  bytes public_key = 3;
}

// Provider ownership configuration
enum ProviderOwnership {
  PROVIDER_OWNERSHIP_UNSPECIFIED = 0;
  PROVIDER_OWNERSHIP_SHARED = 1;   // Distributed via secret sharing from coordinator
  PROVIDER_OWNERSHIP_LOCAL = 2;    // Per-node only, not distributed
}

// Configuration for a provider's key sharing behavior
message ProviderSharingConfig {
  // Provider name (e.g., "anthropic", "openai", "ollama")
  string name = 1;
  // Ownership type (shared or local)
  ProviderOwnership ownership = 2;
  // Secret sharing configuration (for SHARED providers)
  SecretSharingConfig sharing_config = 3;
}

// ========================================
// Key Sharing Protocol Messages (Channel 4)
// ========================================

// Key sharing protocol message envelope
message KeySharingMessage {
  oneof message_type {
    KeyShareRequest request = 1;
    KeyShareResponse response = 2;
    KeyRevocation revocation = 3;
    KeyHeartbeat heartbeat = 4;
  }
}

// Request for API key shares from coordinator
message KeyShareRequest {
  // Requester's public key
  bytes requester_pubkey = 1;
  // Which providers are being requested
  repeated string providers = 2;
  // Signed challenge response proving identity
  IdentityChallengeResponse challenge_response = 3;
  // Preferred sharing mode
  KeySharingMode preferred_mode = 4;
}

// Response with secret shares
message KeyShareResponse {
  // Whether the request was approved
  bool approved = 1;
  // Rejection reason if not approved
  string rejection_reason = 2;
  // Secret shares for approved providers
  repeated SecretShare shares = 3;
  // Next challenge for heartbeat/refresh
  IdentityChallenge next_challenge = 4;
}

// Key revocation message (broadcast from coordinator)
message KeyRevocation {
  // Provider being revoked
  string provider = 1;
  // Node being revoked (empty = all nodes)
  bytes revoked_pubkey = 2;
  // Reason for revocation
  string reason = 3;
  // Coordinator's signature
  bytes coordinator_signature = 4;
  // When revocation takes effect
  google.protobuf.Timestamp effective_at = 5;
}

// Heartbeat to maintain key access
message KeyHeartbeat {
  // Node's public key
  bytes public_key = 1;
  // Signed challenge response
  IdentityChallengeResponse challenge_response = 2;
  // Currently held key IDs (for tracking)
  repeated string active_key_ids = 3;
}
