syntax = "proto3";

package ergors.orch.v1;

import "google/protobuf/timestamp.proto";
import "google/protobuf/struct.proto";
import "network/v1/network.proto";
import "storage/v1/storage.proto";


// Configuration Types
message HoConfig {
  network.v1.NetworkConfig network = 1;
  network.v1.NodeIdentity identity = 2;
  storage.v1.StorageConfig storage = 3;
  LlmRouterConfig llm = 4;
  string home = 5;
  // Custody configuration for node identity key management
  storage.v1.NodeIdentityCustodyConfig custody = 6;
  // CosmWasm VM configuration
  CosmwasmConfig cosmwasm = 7;
}

// ==============================================
// CosmWasm VM Configuration
// ==============================================

// Configuration for the CosmWasm VM and initial contract deployment
message CosmwasmConfig {
  // Enable CosmWasm VM
  bool enabled = 1;

  // Directory for WASM module cache
  string cache_dir = 2;

  // Memory limit for WASM execution (bytes)
  uint64 memory_limit = 3;

  // Gas limits for different operation types
  CosmwasmGasLimits gas_limits = 4;

  // Contracts to deploy on coordinator startup
  repeated ContractDeployment initial_contracts = 5;
}

// Gas limits for CosmWasm operations
message CosmwasmGasLimits {
  // Gas limit for contract instantiation
  uint64 instantiate = 1;
  // Gas limit for contract execution
  uint64 execute = 2;
  // Gas limit for contract queries
  uint64 query = 3;
  // Gas limit for contract migration
  uint64 migrate = 4;
}

// Contract deployment specification for startup initialization
message ContractDeployment {
  // Unique name for this contract (used for resolution)
  string name = 1;

  // Path to the WASM binary file (absolute or relative to home)
  string wasm_path = 2;

  // Alternative: embedded WASM bytes (base64 encoded)
  bytes wasm_bytes = 3;

  // Label for the contract instance
  string label = 4;

  // JSON-encoded instantiation message
  string init_msg = 5;

  // Admin address (optional - coordinator pubkey if empty)
  string admin = 6;

  // Whether this contract is required (fail startup if deployment fails)
  bool required = 7;

  // Node types that should deploy this contract
  // Empty means all coordinators deploy it
  repeated string deploy_on_node_types = 8;

  // Contract-specific configuration
  ContractConfig config = 9;
}

// Additional contract-specific configuration
message ContractConfig {
  // Whether to skip deployment if contract already exists
  bool skip_if_exists = 1;

  // Migration configuration (for upgrades)
  ContractMigration migration = 2;

  // Custom metadata
  map<string, string> metadata = 3;
}

// Contract migration configuration
message ContractMigration {
  // Enable automatic migration on startup
  bool auto_migrate = 1;
  // JSON-encoded migration message
  string migrate_msg = 2;
}




// Query operations for the orchestration component.
service QueryService {
 

}

// Cosmic Orchestration Types
message CosmicTask {
  string id = 1;
  OrchestrateTask task_type = 2;
  CosmicTaskStatus status = 3;
  string prompt = 4;
  FractalRequirements fractal_requirements = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
  google.protobuf.Struct result = 8;
  string error = 9;
}

enum OrchestrateTask {
  ORCHESTRATE_TASK_UNSPECIFIED = 0;
  ORCHESTRATE_TASK_BOOTSTRAP = 1;
  ORCHESTRATE_TASK_RECURSIVE = 2;
}

enum CosmicTaskStatus {
  COSMIC_TASK_STATUS_UNSPECIFIED = 0;
  COSMIC_TASK_STATUS_PENDING = 1;
  COSMIC_TASK_STATUS_RUNNING = 2;
  COSMIC_TASK_STATUS_COMPLETED = 3;
  COSMIC_TASK_STATUS_FAILED = 4;
  COSMIC_TASK_STATUS_FRACTAL_EXPANSION = 5;
  COSMIC_TASK_STATUS_GEOMETRIC_VALIDATION = 6;
}

message CosmicContext {
  string task_id = 1;
  string user_input = 2;
  uint32 current_step = 3;
  uint32 total_steps = 4;
  uint32 fractal_level = 5;
  string golden_ratio_state = 6;
  repeated PromptResponse previous_responses = 7;
  map<string, google.protobuf.Struct> cosmic_metadata = 8;
}

message FractalRequirements {
  CosmicContext context = 1;
  uint32 recursion_depth = 2;
  double self_similarity_threshold = 3;
  bool golden_ratio_compliance = 4;
  double fractal_dimension_target = 5;
  bool mobius_continuity = 6;
  double fractal_coherence = 7;
  repeated string expansion_criteria = 8;
}

/// PromptRequest: Parse flexible prompt request formats into canonical PromptRequest
///
/// Accepts:
/// Type URL: `/ergors.orch.v1.PromptRequest`
/// 1. Full PromptRequest (canonical): `{"messages": [{"role": "user", "content": "..."}], "model": "gpt-4"}`
message PromptRequest {
  repeated PromptMessage messages = 1;
  string model = 2;
  PromptContext context = 3;
  LlmPromptConfig llm_config = 4;
  // AI SDK tool support
  repeated ToolDefinition tools = 5;    // Available tools
  string tool_choice = 6;               // "auto", "none", "required", or specific tool name
  bool stream = 7;                      // Enable streaming response
  string system = 8;                    // System message (Anthropic style)
}

message PromptResponse {
  bytes id = 1;
  string provider = 2;
  string model = 3;
  string prompt = 4;
  repeated string response = 5;
  google.protobuf.Timestamp timestamp = 6;
  TokenUsage tokens_used = 7;
  double cost = 8;
  uint64 latency_ms = 9;
}

message PromptMessage {
  string role = 1;
  string content = 2;
  // Tool call support (AI SDK compatible)
  repeated ToolUse tool_calls = 3;      // For assistant messages with tool calls
  ToolResult tool_result = 4;           // For tool role messages
  repeated ContentBlock content_blocks = 5; // Multi-part content (text + tool use)
}

// ==============================================
// AI SDK Compatible Tool Types
// ==============================================

// Tool definition for function calling (AI SDK format)
message ToolDefinition {
  string type = 1;              // "function" for function tools
  FunctionDefinition function = 2;
}

message FunctionDefinition {
  string name = 1;
  string description = 2;
  google.protobuf.Struct parameters = 3;  // JSON Schema for parameters
  bool strict = 4;              // Strict mode for structured outputs
}

// Tool use/call in assistant message
message ToolUse {
  string id = 1;                // Unique ID for this tool call
  string type = 2;              // "function"
  FunctionCall function = 3;
}

message FunctionCall {
  string name = 1;              // Function name
  string arguments = 2;         // JSON string of arguments
}

// Tool result from user/tool role
message ToolResult {
  string tool_call_id = 1;      // References ToolUse.id
  string content = 2;           // Result content (text)
  bool is_error = 3;            // Whether this is an error result
}

// Content block for multi-part messages
message ContentBlock {
  string type = 1;              // "text", "tool_use", "tool_result", "image"
  oneof block {
    string text = 2;
    ToolUse tool_use = 3;
    ToolResult tool_result = 4;
    ImageContent image = 5;
  }
}

// Image content for vision models
message ImageContent {
  string type = 1;              // "base64" or "url"
  string media_type = 2;        // "image/png", "image/jpeg", etc.
  string data = 3;              // Base64 data or URL
}

message PromptContext {
  string session_id = 1;
  string user_id = 2;
  string thread_id = 3;
}

message TokenUsage {
  uint32 prompt = 1;
  uint32 completion = 2;
  uint32 total = 3;
}

message LlmPromptConfig {
  uint32 temperature = 1;
  uint32 max_tokens = 2;
  uint32 top_p = 3;
  repeated string stop_sequences = 4;
}

// LLM Provider Types
message LLMProvider {
  string name = 1;
  string base_url = 2;
  repeated string supported_models = 3;
  LlmModel provider_type = 4;
}

enum LlmModel {
  AkashMl = 0;
  OllamaLocal = 1;
  KimiResearch = 2;
  Grok = 3;
  OpenAI = 4;
  Anthropic = 5;
  Custom = 6;
}

 // Local config structure that matches the existing implementation
message LocalLlmConfig {
  uint64 timeout_seconds = 1;
  string api_keys_file = 2;
}

message OpenAiRequest {
  string model = 1;
  repeated OpenAiMessage messages = 2;
  uint32 temperature = 3;
  uint32 max_tokens = 4;
  // AI SDK tool support
  repeated ToolDefinition tools = 5;
  string tool_choice = 6;               // "auto", "none", "required"
  bool stream = 7;
  double top_p = 8;
  double frequency_penalty = 9;
  double presence_penalty = 10;
  repeated string stop = 11;
}

message OpenAiUsage {
  uint32 prompt_tokens = 1;
  uint32 completion_tokens = 2;
  uint32 total_tokens = 3;
}

message OpenAiMessage {
  string role = 1;
  string content = 2;
  // Tool call support
  repeated ToolUse tool_calls = 3;      // For assistant messages
  string tool_call_id = 4;              // For tool role messages
  string name = 5;                      // Function name (for function role, deprecated)
}

message OpenAiResponse {
  string id = 1;
  string object = 2;                    // "chat.completion" or "chat.completion.chunk"
  int64 created = 3;
  string model = 4;
  repeated OpenAiChoice choices = 5;
  OpenAiUsage usage = 6;
  string system_fingerprint = 7;
}

message OpenAiChoice {
  uint32 index = 1;
  OpenAiMessage message = 2;
  OpenAiDelta delta = 3;                // For streaming
  string finish_reason = 4;             // "stop", "tool_calls", "length", etc.
}

// Delta for streaming responses
message OpenAiDelta {
  string role = 1;
  string content = 2;
  repeated ToolUse tool_calls = 3;
}

// ==============================================
// Anthropic API Types (Claude)
// ==============================================

message AnthropicRequest {
  string model = 1;
  repeated AnthropicMessage messages = 2;
  uint32 max_tokens = 3;
  string system = 4;                    // System prompt (separate from messages)
  repeated AnthropicTool tools = 5;
  AnthropicToolChoice tool_choice = 6;
  bool stream = 7;
  double temperature = 8;
  double top_p = 9;
  uint32 top_k = 10;
  repeated string stop_sequences = 11;
  AnthropicMetadata metadata = 12;
}

message AnthropicMessage {
  string role = 1;                      // "user" or "assistant"
  oneof content {
    string text = 2;                    // Simple text content
    AnthropicContentList blocks = 3;    // Multi-part content
  }
}

message AnthropicContentList {
  repeated AnthropicContentBlock blocks = 1;
}

message AnthropicContentBlock {
  string type = 1;                      // "text", "tool_use", "tool_result", "image"
  // For type="text"
  string text = 2;
  // For type="tool_use"
  string id = 3;
  string name = 4;
  google.protobuf.Struct input = 5;
  // For type="tool_result"
  string tool_use_id = 6;
  bool is_error = 7;
  // For type="image"
  AnthropicImageSource source = 8;
}

message AnthropicImageSource {
  string type = 1;                      // "base64" or "url"
  string media_type = 2;
  string data = 3;
}

message AnthropicTool {
  string name = 1;
  string description = 2;
  google.protobuf.Struct input_schema = 3;
}

message AnthropicToolChoice {
  string type = 1;                      // "auto", "any", "tool"
  string name = 2;                      // Required if type="tool"
}

message AnthropicMetadata {
  string user_id = 1;
}

message AnthropicResponse {
  string id = 1;
  string type = 2;                      // "message"
  string role = 3;                      // "assistant"
  repeated AnthropicContentBlock content = 4;
  string model = 5;
  string stop_reason = 6;               // "end_turn", "tool_use", "max_tokens", "stop_sequence"
  string stop_sequence = 7;
  AnthropicUsage usage = 8;
}

message AnthropicUsage {
  uint32 input_tokens = 1;
  uint32 output_tokens = 2;
  uint32 cache_creation_input_tokens = 3;
  uint32 cache_read_input_tokens = 4;
}

// Anthropic streaming event types
message AnthropicStreamEvent {
  string type = 1;                      // message_start, content_block_start, content_block_delta, etc.
  AnthropicResponse message = 2;        // For message_start
  uint32 index = 3;                     // For content_block_*
  AnthropicContentBlock content_block = 4;
  AnthropicDelta delta = 5;
  AnthropicUsage usage = 6;
}

message AnthropicDelta {
  string type = 1;                      // "text_delta", "input_json_delta"
  string text = 2;
  string partial_json = 3;
  string stop_reason = 4;
  string stop_sequence = 5;
}

enum ModelSelectionStrategy {
  MODEL_SELECTION_STRATEGY_UNSPECIFIED = 0;
  // Always use highest priority available
  MODEL_SELECTION_STRATEGY_PRIORITY = 1;
  // Round-robin across available providers
  MODEL_SELECTION_STRATEGY_ROUND_ROBIN = 2;
  // Golden ratio weighted selection
  MODEL_SELECTION_STRATEGY_GOLDEN_RATIO = 3;
  // Load-based selection
  MODEL_SELECTION_STRATEGY_LOAD_BALANCED = 4;
}
 
// Llm config is the global configuration of all llm models available, and their subconfigurations.
message LlmRouterConfig {
  string api_keys_file = 1;
  repeated LlmEntity entities = 2;
  ModelSelectionStrategy default_strategy = 3;
  uint64 timeout_seconds = 4;
  uint32 max_retries = 5;
  uint32 default_entity = 6;
}
 
/// LlmEntity is a single llm model entity. Contains information about available models, stragegy in use of the framework, and other configuration files 
message LlmEntity {
  string name = 1;
  string base_url = 2;
  repeated string models = 3;
  string default_model = 4;
  uint32 priority = 5; // Using uint32 for u8
  bool enabled = 6;
    ModelSelectionStrategy default_strategy = 7;
  uint64 timeout_seconds = 8;
  uint32 max_retries = 9;
}

message LoggingConfig {
  string level = 1;
  string file = 2;
}

// Route Request/Response Messages
// These follow the type/value tuple pattern for transport layer standardization

// Health endpoint
message HealthRequest {}

message HealthResponse {
  string status = 1;
  string version = 2;
  uint64 uptime_seconds = 3;
  string storage_status = 4;
  string network_status = 5;
}

// Query endpoint
message QueryPromptsRequest {
  string session_id = 1;
  string user_id = 2;
  uint32 limit = 3;
  uint64 before_timestamp = 4;
  uint64 after_timestamp = 5;
}

message QueryPromptsResponse {
  repeated PromptResponse prompts = 1;
  uint32 total_count = 2;
}


message BootstrapRequest {
  // bootstrap method
  BootstrapMethod bootstrap_method = 1;
  // node-identity
  network.v1.NodeIdentity identity = 2;
  // Key sharing: signed challenge proving identity ownership
  network.v1.IdentityChallengeResponse challenge_response = 3;
  // Key sharing: which providers the node wants access to
  repeated string requested_providers = 4;
  // Key sharing: preferred mode (DIRECT or SHAMIR)
  network.v1.KeySharingMode preferred_mode = 5;
}

message BootstrapMethod {
  oneof method {
    Ssh ssh = 1;
    Cloud cloud = 2;
    Docker docker = 3;
    Bluetooth bluetooth = 4;
  }
}

message Ssh {
  string ssh_key_path = 1;
}

message Cloud {
  oneof provider {
    Akash akash = 1;
    Wavs wavs = 2;
    Phala phala = 3;
    Ec2 ec2 = 4;
  }
}

message Bluetooth {}
message Local {}
message Docker {}

// Akash Network deployment via Console API (not raw chain)
message Akash {
  string api_key = 1; // Console API key (x-api-key header)
  string sdl_content = 2; // SDL (Stack Definition Language) content as string
  uint32 deposit_usd = 3; // Deposit in USD (minimum $5)
  string api_base_url = 4; // Console API base URL (default: https://api.cloudmos.io)

  // Optional certificate for mTLS authentication
  AkashCertificate certificate = 5;
}

message AkashCertificate {
  string cert_pem = 1;
  string key_pem = 2;
}

// WAVS (Web3 Agent Virtual Stack) deployment
message Wavs {
  string api_key = 1;
  string network = 2;  // "mainnet" or "testnet"
  string component_id = 3;
}

// Phala Network TEE deployment
message Phala {
  string api_key = 1;
  string cluster_id = 2;
  string tee_mode = 3;  // "sgx" or "tdx"
  string contract_id = 4;
}

// AWS EC2 deployment
message Ec2 {
  string region = 1;
  string instance_type = 2;
  string ami_id = 3;
  string key_name = 4;
  string security_group_id = 5;
  string subnet_id = 6;
  string iam_instance_profile = 7;
  map<string, string> tags = 8;
}

message BootstrapResponse {
  string id = 1;
  string target_node = 2;
  string status = 3;
  string summary = 4;
  google.protobuf.Timestamp timestamp = 5;
  uint64 duration_ms = 6;
  // Key sharing: address of identity registry contract
  string identity_contract_address = 7;
  // Key sharing: secret shares for requested providers
  repeated network.v1.SecretShare secret_shares = 8;
  // Key sharing: next challenge for heartbeat/refresh
  network.v1.IdentityChallenge next_challenge = 9;
}

// Bootstrap endpoint
message BootstrapNodeRequest {
  // name provided to the node you are bootstrapping
  string target_node = 1;
  string ssh_key_path = 2;
  string ssh_user = 3;
  string ssh_port = 4;
}

message BootstrapNodeResponse {
  string id = 1;
  string target_node = 2;
  string status = 3;
  string summary = 4;
  google.protobuf.Timestamp timestamp = 5;
  uint64 duration_ms = 6;
}

// Fractal creation endpoint
message CreateFractalRequest {
  string prompt = 1;
  FractalRequirements requirements = 2;
  PromptContext context = 3;
}

message CreateFractalResponse {
  string task_id = 1;
  CosmicTaskStatus status = 2;
  string error = 3;
  google.protobuf.Timestamp created_at = 4;
}

// Prune endpoint
message PruneNodeRequest {
  bool force = 1;
  uint64 retain_after_timestamp = 2;
}

message PruneNodeResponse {
  bool success = 1;
  uint64 pruned_bytes = 2;
  uint64 pruned_entries = 3;
  string error = 4;
}

// Network topology endpoint
message GetTopologyRequest {}

message GetTopologyResponse {
  network.v1.NetworkTopology topology = 1;
  network.v1.NodeIdentity node_identity = 2;
}

// Route Metadata and Configuration
enum HttpMethod {
  HTTP_METHOD_UNSPECIFIED = 0;
  HTTP_METHOD_GET = 1;
  HTTP_METHOD_POST = 2;
  HTTP_METHOD_PUT = 3;
  HTTP_METHOD_DELETE = 4;
  HTTP_METHOD_PATCH = 5;
}

message RouteMetadata {
  string path = 1;
  string name = 2;
  HttpMethod method = 3;
  bool requires_auth = 4;
  string request_type = 5;  // Proto type URL (e.g., "ergors.orch.v1.HealthRequest")
  string response_type = 6; // Proto type URL (e.g., "ergors.orch.v1.HealthResponse")
  string description = 7;
}

message RouteRegistry {
  repeated RouteMetadata routes = 1;
}



// JSON structure for the api-keys.json file
message ApiKeysJson {
  ApiKeysMetadata metadata = 1;
  map<string, ProviderWithAuth> providers = 2;
  GlobalSettings global_settings = 3;
  Instructions instructions = 4;
}

message ApiKeysMetadata {
  string version = 1;
  string description = 2;
  string golden_ratio_note = 3;
}

/// Provider configuration with authentication
/// Combines LlmEntity (standard type) with api_key and prompt defaults
message ProviderWithAuth {
  string api_key = 1;
  LlmEntity entity = 2;
}

message GlobalSettings {
  int32 default_timeout_seconds = 1;
  int32 max_retry_attempts = 2;
  bool golden_ratio_weighting = 3;
  bool fallback_enabled = 4;
  int32 health_check_interval_seconds = 5;
}

message Instructions {
  repeated string setup = 1;
  repeated string security = 2;
}

// ========================================
// Deployment State Management Types
// ========================================

// Deployment type classification
enum DeploymentType {
  DEPLOYMENT_TYPE_UNSPECIFIED = 0;
  DEPLOYMENT_TYPE_NODE = 1; // Full ERGORS node deployment
  DEPLOYMENT_TYPE_LLM_INFERENCE = 2; // LLM inference provider endpoint
}

// Deployment status lifecycle
enum DeploymentStatus {
  DEPLOYMENT_STATUS_UNSPECIFIED = 0;
  DEPLOYMENT_STATUS_PENDING = 1;
  DEPLOYMENT_STATUS_PROVISIONING = 2;
  DEPLOYMENT_STATUS_DEPLOYING = 3;
  DEPLOYMENT_STATUS_RUNNING = 4;
  DEPLOYMENT_STATUS_UPDATING = 5;
  DEPLOYMENT_STATUS_STOPPING = 6;
  DEPLOYMENT_STATUS_STOPPED = 7;
  DEPLOYMENT_STATUS_FAILED = 8;
  DEPLOYMENT_STATUS_TERMINATED = 9;
}

// Runtime state for a deployment
message DeploymentState {
  string deployment_id = 1;
  DeploymentType deployment_type = 2;
  DeploymentStatus status = 3;
  BootstrapMethod bootstrap_method = 4;
  network.v1.NodeIdentity identity = 5;

  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
  google.protobuf.Timestamp started_at = 8;
  google.protobuf.Timestamp completed_at = 9;

  // Runtime information
  DeploymentRuntime runtime = 10;

  // Progress tracking
  repeated DeploymentEvent events = 11;

  // Resource tracking
  ResourceMetrics resources = 12;

  // Error information
  string error_message = 13;
  string error_trace = 14;
}

// Runtime information for active deployments
message DeploymentRuntime {
  // Network endpoints
  repeated string endpoints = 1;
  string api_endpoint = 2;
  string p2p_endpoint = 3;

  // Provider-specific data
  AkashRuntime akash = 4;

  // Health check data
  HealthCheckData health = 5;

  // Configuration
  map<string, string> env_vars = 6;
  string version = 7;

  // Additional provider runtimes
  Ec2Runtime ec2 = 8;
  PhalaRuntime phala = 9;
  WavsRuntime wavs = 10;
}

// Akash-specific runtime data
message AkashRuntime {
  string deployment_sequence = 1; // dseq
  string order_sequence = 2; // oseq
  string group_sequence = 3; // gseq
  string provider_address = 4;
  string lease_id = 5;
  repeated string service_endpoints = 6;
  uint64 lease_price_per_block = 7; // in uakt
  string provider_host_uri = 8;
}

// EC2-specific runtime data
message Ec2Runtime {
  string instance_id = 1;
  string public_ip = 2;
  string private_ip = 3;
  string availability_zone = 4;
  string instance_state = 5;
  string public_dns = 6;
}

// Phala-specific runtime data
message PhalaRuntime {
  string contract_id = 1;
  string cluster_id = 2;
  repeated string worker_endpoints = 3;
  string attestation_report = 4;
}

// WAVS-specific runtime data
message WavsRuntime {
  string component_id = 1;
  string trigger_id = 2;
  repeated string service_endpoints = 3;
}

// Health check information
message HealthCheckData {
  bool is_healthy = 1;
  string last_check_time = 2;
  uint32 consecutive_failures = 3;
  string health_endpoint = 4;
}

// Deployment event for audit trail
message DeploymentEvent {
  google.protobuf.Timestamp timestamp = 1;
  DeploymentStatus status = 2;
  string message = 3;
  string metadata_json = 4;
}

// Resource metrics for deployments
message ResourceMetrics {
  uint32 cpu_millicores = 1;
  uint64 memory_bytes = 2;
  uint64 storage_bytes = 3;
  uint32 bandwidth_mbps = 4;
  double cost_per_hour = 5;
}

// Request to deploy multiple resources in parallel
message DeployBatchRequest {
  repeated DeploymentSpec deployments = 1;
  bool wait_for_completion = 2;
  uint32 timeout_seconds = 3;
}

// Specification for a single deployment
message DeploymentSpec {
  string name = 1;
  DeploymentType deployment_type = 2;
  BootstrapMethod bootstrap_method = 3;
  network.v1.NodeIdentity identity = 4;
  LlmEntity llm_config = 5; // For LLM inference deployments
  map<string, string> labels = 6; // Arbitrary labels for organization
}

// Response for batch deployment
message DeployBatchResponse {
  repeated DeploymentState deployments = 1;
  uint32 successful = 2;
  uint32 failed = 3;
  uint32 pending = 4;
}

// Query deployment state
message QueryDeploymentRequest {
  string deployment_id = 1;
  DeploymentType deployment_type = 2;
  DeploymentStatus status = 3;
  uint32 limit = 4;
}

message QueryDeploymentResponse {
  repeated DeploymentState deployments = 1;
  uint32 total_count = 2;
}

// Update deployment
message UpdateDeploymentRequest {
  string deployment_id = 1;
  DeploymentStatus target_status = 2; // For stop/start operations
   map<string, string> env_vars = 3; // Update environment variables
}

message UpdateDeploymentResponse {
  DeploymentState deployment = 1;
  bool success = 2;
  string message = 3;
}

// ========================================
// Key Sharing Types (defined in network/v1/network.proto)
// ========================================
// The following types are imported from network.v1:
// - KeySharingMode, SecretSharingConfig, SecretShare
// - IdentityChallenge, IdentityChallengeResponse
// - ProviderOwnership, ProviderSharingConfig

