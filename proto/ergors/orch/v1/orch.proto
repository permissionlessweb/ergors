syntax = "proto3";

package ergors.orch.v1;

import "google/protobuf/timestamp.proto";
import "google/protobuf/struct.proto";
import "network/v1/network.proto";
import "storage/v1/storage.proto";
import "akash/cert/v1/cert.proto";


// Configuration Types
message HoConfig {
  network.v1.NetworkConfig network = 1;
  network.v1.NodeIdentity identity = 2;
  storage.v1.StorageConfig storage = 3;
  LlmRouterConfig llm = 4;
  string home = 5;
  // Custody configuration for node identity key management
  storage.v1.NodeIdentityCustodyConfig custody = 6;
  // CosmWasm VM configuration
  CosmwasmConfig cosmwasm = 7;
  // Akash deployment configuration
  AkashDeployConfig akash = 8;
}

// ==============================================
// CosmWasm VM Configuration
// ==============================================

// Configuration for the CosmWasm VM and initial contract deployment
message CosmwasmConfig {
  // Enable CosmWasm VM
  bool enabled = 1;

  // Directory for WASM module cache
  string cache_dir = 2;

  // Memory limit for WASM execution (bytes)
  uint64 memory_limit = 3;

  // Gas limits for different operation types
  CosmwasmGasLimits gas_limits = 4;

  // Contracts to deploy on coordinator startup
  repeated ContractDeployment initial_contracts = 5;
}

// Gas limits for CosmWasm operations
message CosmwasmGasLimits {
  // Gas limit for contract instantiation
  uint64 instantiate = 1;
  // Gas limit for contract execution
  uint64 execute = 2;
  // Gas limit for contract queries
  uint64 query = 3;
  // Gas limit for contract migration
  uint64 migrate = 4;
}

// Contract deployment specification for startup initialization
message ContractDeployment {
  // Unique name for this contract (used for resolution)
  string name = 1;

  // Path to the WASM binary file (absolute or relative to home)
  string wasm_path = 2;

  // Alternative: embedded WASM bytes (base64 encoded)
  bytes wasm_bytes = 3;

  // Label for the contract instance
  string label = 4;

  // JSON-encoded instantiation message
  string init_msg = 5;

  // Admin address (optional - coordinator pubkey if empty)
  string admin = 6;

  // Whether this contract is required (fail startup if deployment fails)
  bool required = 7;

  // Node types that should deploy this contract
  // Empty means all coordinators deploy it
  repeated string deploy_on_node_types = 8;

  // Contract-specific configuration
  ContractConfig config = 9;
}

// Additional contract-specific configuration
message ContractConfig {
  // Whether to skip deployment if contract already exists
  bool skip_if_exists = 1;

  // Migration configuration (for upgrades)
  ContractMigration migration = 2;

  // Custom metadata
  map<string, string> metadata = 3;
}

// Contract migration configuration
message ContractMigration {
  // Enable automatic migration on startup
  bool auto_migrate = 1;
  // JSON-encoded migration message
  string migrate_msg = 2;
}




// Query operations for the orchestration component.
service QueryService {


}

// RLM Document Service (for embedded Python REPL workers)
service RlmDocumentService {
  rpc GetDocuments(GetDocumentsRequest) returns (GetDocumentsResponse);
}

// Cosmic Orchestration Types
message CosmicTask {
  string id = 1;
  OrchestrateTask task_type = 2;
  CosmicTaskStatus status = 3;
  string prompt = 4;
  FractalRequirements fractal_requirements = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
  google.protobuf.Struct result = 8;
  string error = 9;
}

enum OrchestrateTask {
  ORCHESTRATE_TASK_UNSPECIFIED = 0;
  ORCHESTRATE_TASK_BOOTSTRAP = 1;
  ORCHESTRATE_TASK_RECURSIVE = 2;
}

enum CosmicTaskStatus {
  COSMIC_TASK_STATUS_UNSPECIFIED = 0;
  COSMIC_TASK_STATUS_PENDING = 1;
  COSMIC_TASK_STATUS_RUNNING = 2;
  COSMIC_TASK_STATUS_COMPLETED = 3;
  COSMIC_TASK_STATUS_FAILED = 4;
  COSMIC_TASK_STATUS_FRACTAL_EXPANSION = 5;
  COSMIC_TASK_STATUS_GEOMETRIC_VALIDATION = 6;
}

message CosmicContext {
  string task_id = 1;
  string user_input = 2;
  uint32 current_step = 3;
  uint32 total_steps = 4;
  uint32 fractal_level = 5;
  string golden_ratio_state = 6;
  repeated PromptResponse previous_responses = 7;
  map<string, google.protobuf.Struct> cosmic_metadata = 8;
}

message FractalRequirements {
  CosmicContext context = 1;
  uint32 recursion_depth = 2;
  double self_similarity_threshold = 3;
  bool golden_ratio_compliance = 4;
  double fractal_dimension_target = 5;
  bool mobius_continuity = 6;
  double fractal_coherence = 7;
  repeated string expansion_criteria = 8;
}

/// PromptRequest: Parse flexible prompt request formats into canonical PromptRequest
///
/// Accepts:
/// Type URL: `/ergors.orch.v1.PromptRequest`
/// 1. Full PromptRequest (canonical): `{"messages": [{"role": "user", "content": "..."}], "model": "gpt-4"}`
message PromptRequest {
  repeated PromptMessage messages = 1;
  string model = 2;
  PromptContext context = 3;
  LlmPromptConfig llm_config = 4;
  // AI SDK tool support
  repeated ToolDefinition tools = 5;    // Available tools
  string tool_choice = 6;               // "auto", "none", "required", or specific tool name
  bool stream = 7;                      // Enable streaming response
  string system = 8;                    // System message (Anthropic style)

  // ===== Open Responses Extensions =====
  optional string previous_response_id = 9;      // Conversation resumption
  repeated string allowed_tools = 10;            // Cache-preserving tool filter
  optional string truncation = 11;               // "auto" | "disabled"
  optional string service_tier = 12;             // "standard" | "priority" | "batch"
  optional string response_format = 13;          // "ergors" | "open_responses" | "auto"
}

message PromptResponse {
  bytes id = 1;
  string provider = 2;
  string model = 3;
  string prompt = 4;
  repeated string response = 5;
  google.protobuf.Timestamp timestamp = 6;
  TokenUsage tokens_used = 7;
  double cost = 8;
  uint64 latency_ms = 9;

  // ===== Open Responses Extensions =====
  optional string status = 10;                   // "in_progress" | "completed" | "failed"
  repeated ResponseOutputItem output = 11;       // Open Responses items array
  optional ResponseMetadata response_metadata = 12;
}

// ===== Open Responses Types =====

// Output item in Open Responses format (polymorphic via oneof)
message ResponseOutputItem {
  string id = 1;                                 // Unique item ID
  string type = 2;                               // "message" | "function_call" | "function_call_output"
  string status = 3;                             // "in_progress" | "completed" | "incomplete"

  oneof content {
    MessageItemContent message = 4;              // Reuses ContentBlock!
    FunctionCallItemContent function_call = 5;
    FunctionCallOutputItemContent function_call_output = 6;
  }
}

// Message item content (maps to existing PromptMessage/ContentBlock)
message MessageItemContent {
  string role = 1;                               // "user" | "assistant" | "system"
  repeated ContentBlock content = 2;             // REUSE existing ContentBlock
}

// Function call item content (maps to existing ToolUse)
message FunctionCallItemContent {
  string name = 1;
  string arguments = 2;                          // JSON string
  string call_id = 3;                            // For result correlation
}

// Function call output (maps to existing ToolResult)
message FunctionCallOutputItemContent {
  string call_id = 1;                            // References function_call item
  string output = 2;                             // Result content
}

// Response metadata for Open Responses
message ResponseMetadata {
  google.protobuf.Timestamp created = 1;
  google.protobuf.Timestamp completed = 2;
  string previous_response_id = 3;               // Echo back for chaining
}

// Open Responses streaming event envelope
message OpenResponsesStreamEvent {
  string event = 1;                              // Event type (e.g., "response.output_item.added")
  uint32 sequence_number = 2;
  string response_id = 3;

  oneof payload {
    ResponseStatusPayload status = 4;
    OutputItemPayload item = 5;
    TextDeltaPayload text_delta = 6;
  }
}

// Response status event (in_progress, completed, failed)
message ResponseStatusPayload {
  string status = 1;
}

// Output item event (added, done)
message OutputItemPayload {
  uint32 output_index = 1;                       // Item index in output array
  ResponseOutputItem item = 2;
}

// Text delta event (delta, done)
message TextDeltaPayload {
  uint32 output_index = 1;
  uint32 content_index = 2;
  string delta = 3;                              // Incremental text
}

message PromptMessage {
  string role = 1;
  string content = 2;
  // Tool call support (AI SDK compatible)
  repeated ToolUse tool_calls = 3;      // For assistant messages with tool calls
  ToolResult tool_result = 4;           // For tool role messages
  repeated ContentBlock content_blocks = 5; // Multi-part content (text + tool use)
}

// ==============================================
// AI SDK Compatible Tool Types
// ==============================================

// Tool definition for function calling (AI SDK format)
message ToolDefinition {
  string type = 1;              // "function" for function tools
  FunctionDefinition function = 2;
}

message FunctionDefinition {
  string name = 1;
  string description = 2;
  google.protobuf.Struct parameters = 3;  // JSON Schema for parameters
  bool strict = 4;              // Strict mode for structured outputs
}

// Tool use/call in assistant message
message ToolUse {
  string id = 1;                // Unique ID for this tool call
  string type = 2;              // "function"
  FunctionCall function = 3;
}

message FunctionCall {
  string name = 1;              // Function name
  string arguments = 2;         // JSON string of arguments
}

// Tool result from user/tool role
message ToolResult {
  string tool_call_id = 1;      // References ToolUse.id
  string content = 2;           // Result content (text)
  bool is_error = 3;            // Whether this is an error result
}

// Content block for multi-part messages
message ContentBlock {
  string type = 1;              // "text", "tool_use", "tool_result", "image"
  oneof block {
    string text = 2;
    ToolUse tool_use = 3;
    ToolResult tool_result = 4;
    ImageContent image = 5;
  }
}

// Image content for vision models
message ImageContent {
  string type = 1;              // "base64" or "url"
  string media_type = 2;        // "image/png", "image/jpeg", etc.
  string data = 3;              // Base64 data or URL
}

message PromptContext {
  string session_id = 1;
  string user_id = 2;
  string thread_id = 3;
}

message TokenUsage {
  uint32 prompt = 1;
  uint32 completion = 2;
  uint32 total = 3;
}

message LlmPromptConfig {
  uint32 temperature = 1;
  uint32 max_tokens = 2;
  uint32 top_p = 3;
  repeated string stop_sequences = 4;
}

// LLM Provider Types
message LLMProvider {
  string name = 1;
  string base_url = 2;
  repeated string supported_models = 3;
  LlmModel provider_type = 4;
}

enum LlmModel {
  AkashMl = 0;
  OllamaLocal = 1;
  KimiResearch = 2;
  Grok = 3;
  OpenAI = 4;
  Anthropic = 5;
  Custom = 6;
}

 // Local config structure that matches the existing implementation
message LocalLlmConfig {
  uint64 timeout_seconds = 1;
  string api_keys_file = 2;
}

message OpenAiRequest {
  string model = 1;
  repeated OpenAiMessage messages = 2;
  uint32 temperature = 3;
  uint32 max_tokens = 4;
  // AI SDK tool support
  repeated ToolDefinition tools = 5;
  string tool_choice = 6;               // "auto", "none", "required"
  bool stream = 7;
  double top_p = 8;
  double frequency_penalty = 9;
  double presence_penalty = 10;
  repeated string stop = 11;
}

message OpenAiUsage {
  uint32 prompt_tokens = 1;
  uint32 completion_tokens = 2;
  uint32 total_tokens = 3;
}

message OpenAiMessage {
  string role = 1;
  string content = 2;
  // Tool call support
  repeated ToolUse tool_calls = 3;      // For assistant messages
  string tool_call_id = 4;              // For tool role messages
  string name = 5;                      // Function name (for function role, deprecated)
}

message OpenAiResponse {
  string id = 1;
  string object = 2;                    // "chat.completion" or "chat.completion.chunk"
  int64 created = 3;
  string model = 4;
  repeated OpenAiChoice choices = 5;
  OpenAiUsage usage = 6;
  string system_fingerprint = 7;
}

message OpenAiChoice {
  uint32 index = 1;
  OpenAiMessage message = 2;
  OpenAiDelta delta = 3;                // For streaming
  string finish_reason = 4;             // "stop", "tool_calls", "length", etc.
}

// Delta for streaming responses
message OpenAiDelta {
  string role = 1;
  string content = 2;
  repeated ToolUse tool_calls = 3;
}

// ==============================================
// Anthropic API Types (Claude)
// ==============================================

message AnthropicRequest {
  string model = 1;
  repeated AnthropicMessage messages = 2;
  uint32 max_tokens = 3;
  string system = 4;                    // System prompt (separate from messages)
  repeated AnthropicTool tools = 5;
  AnthropicToolChoice tool_choice = 6;
  bool stream = 7;
  double temperature = 8;
  double top_p = 9;
  uint32 top_k = 10;
  repeated string stop_sequences = 11;
  AnthropicMetadata metadata = 12;
}

message AnthropicMessage {
  string role = 1;                      // "user" or "assistant"
  oneof content {
    string text = 2;                    // Simple text content
    AnthropicContentList blocks = 3;    // Multi-part content
  }
}

message AnthropicContentList {
  repeated AnthropicContentBlock blocks = 1;
}

message AnthropicContentBlock {
  string type = 1;                      // "text", "tool_use", "tool_result", "image"
  // For type="text"
  string text = 2;
  // For type="tool_use"
  string id = 3;
  string name = 4;
  google.protobuf.Struct input = 5;
  // For type="tool_result"
  string tool_use_id = 6;
  bool is_error = 7;
  // For type="image"
  AnthropicImageSource source = 8;
}

message AnthropicImageSource {
  string type = 1;                      // "base64" or "url"
  string media_type = 2;
  string data = 3;
}

message AnthropicTool {
  string name = 1;
  string description = 2;
  google.protobuf.Struct input_schema = 3;
}

message AnthropicToolChoice {
  string type = 1;                      // "auto", "any", "tool"
  string name = 2;                      // Required if type="tool"
}

message AnthropicMetadata {
  string user_id = 1;
}

message AnthropicResponse {
  string id = 1;
  string type = 2;                      // "message"
  string role = 3;                      // "assistant"
  repeated AnthropicContentBlock content = 4;
  string model = 5;
  string stop_reason = 6;               // "end_turn", "tool_use", "max_tokens", "stop_sequence"
  string stop_sequence = 7;
  AnthropicUsage usage = 8;
}

message AnthropicUsage {
  uint32 input_tokens = 1;
  uint32 output_tokens = 2;
  uint32 cache_creation_input_tokens = 3;
  uint32 cache_read_input_tokens = 4;
}

// Anthropic streaming event types
message AnthropicStreamEvent {
  string type = 1;                      // message_start, content_block_start, content_block_delta, etc.
  AnthropicResponse message = 2;        // For message_start
  uint32 index = 3;                     // For content_block_*
  AnthropicContentBlock content_block = 4;
  AnthropicDelta delta = 5;
  AnthropicUsage usage = 6;
}

message AnthropicDelta {
  string type = 1;                      // "text_delta", "input_json_delta"
  string text = 2;
  string partial_json = 3;
  string stop_reason = 4;
  string stop_sequence = 5;
}

enum ModelSelectionStrategy {
  MODEL_SELECTION_STRATEGY_UNSPECIFIED = 0;
  // Always use highest priority available
  MODEL_SELECTION_STRATEGY_PRIORITY = 1;
  // Round-robin across available providers
  MODEL_SELECTION_STRATEGY_ROUND_ROBIN = 2;
  // Golden ratio weighted selection
  MODEL_SELECTION_STRATEGY_GOLDEN_RATIO = 3;
  // Load-based selection
  MODEL_SELECTION_STRATEGY_LOAD_BALANCED = 4;
}
 
// Llm config is the global configuration of all llm models available, and their subconfigurations.
message LlmRouterConfig {
  string api_keys_file = 1;
  repeated LlmEntity entities = 2;
  ModelSelectionStrategy default_strategy = 3;
  uint64 timeout_seconds = 4;
  uint32 max_retries = 5;
  uint32 default_entity = 6;
}
 
/// LlmEntity is a single llm model entity. Contains information about available models, stragegy in use of the framework, and other configuration files 
message LlmEntity {
  string name = 1;
  string base_url = 2;
  repeated string models = 3;
  string default_model = 4;
  uint32 priority = 5; // Using uint32 for u8
  bool enabled = 6;
    ModelSelectionStrategy default_strategy = 7;
  uint64 timeout_seconds = 8;
  uint32 max_retries = 9;
}

message LoggingConfig {
  string level = 1;
  string file = 2;
}

// Route Request/Response Messages
// These follow the type/value tuple pattern for transport layer standardization

// Health endpoint
message HealthRequest {}

message HealthResponse {
  string status = 1;
  string version = 2;
  uint64 uptime_seconds = 3;
  string storage_status = 4;
  string network_status = 5;
}

// Query endpoint
message QueryPromptsRequest {
  string session_id = 1;
  string user_id = 2;
  uint32 limit = 3;
  uint64 before_timestamp = 4;
  uint64 after_timestamp = 5;
}

message QueryPromptsResponse {
  repeated PromptResponse prompts = 1;
  uint32 total_count = 2;
}


message BootstrapRequest {
  // bootstrap method
  BootstrapMethod bootstrap_method = 1;
  // node-identity
  network.v1.NodeIdentity identity = 2;
  // Key sharing: signed challenge proving identity ownership
  network.v1.IdentityChallengeResponse challenge_response = 3;
  // Key sharing: which providers the node wants access to
  repeated string requested_providers = 4;
  // Key sharing: preferred mode (DIRECT or SHAMIR)
  network.v1.KeySharingMode preferred_mode = 5;
}

message BootstrapMethod {
  oneof method {
    Ssh ssh = 1;
    Cloud cloud = 2;
    Docker docker = 3;
    Bluetooth bluetooth = 4;
  }
}

message Ssh {
  string ssh_key_path = 1;
}

message Cloud {
  oneof provider {
    Akash akash = 1;
    Wavs wavs = 2;
    Phala phala = 3;
    Ec2 ec2 = 4;
  }
}

message Bluetooth {}
message Local {}
message Docker {}

// Akash Network deployment via Console API (not raw chain)
message Akash {
  string api_key = 1; // Console API key (x-api-key header)
  string sdl_content = 2; // SDL (Stack Definition Language) content as string
  uint32 deposit_usd = 3; // Deposit in USD (minimum $5)
  string api_base_url = 4; // Console API base URL (default: https://api.cloudmos.io)

  // Optional certificate for mTLS authentication
  AkashCertificate certificate = 5;
}

message AkashCertificate {
  string cert_pem = 1;
  string key_pem = 2;
}

// WAVS (Web3 Agent Virtual Stack) deployment
message Wavs {
  string api_key = 1;
  string network = 2;  // "mainnet" or "testnet"
  string component_id = 3;
}

// Phala Network TEE deployment
message Phala {
  string api_key = 1;
  string cluster_id = 2;
  string tee_mode = 3;  // "sgx" or "tdx"
  string contract_id = 4;
}

// AWS EC2 deployment
message Ec2 {
  string region = 1;
  string instance_type = 2;
  string ami_id = 3;
  string key_name = 4;
  string security_group_id = 5;
  string subnet_id = 6;
  string iam_instance_profile = 7;
  map<string, string> tags = 8;
}

message BootstrapResponse {
  string id = 1;
  string target_node = 2;
  string status = 3;
  string summary = 4;
  google.protobuf.Timestamp timestamp = 5;
  uint64 duration_ms = 6;
  // Key sharing: address of identity registry contract
  string identity_contract_address = 7;
  // Key sharing: secret shares for requested providers
  repeated network.v1.SecretShare secret_shares = 8;
  // Key sharing: next challenge for heartbeat/refresh
  network.v1.IdentityChallenge next_challenge = 9;
}

// Bootstrap endpoint
message BootstrapNodeRequest {
  // name provided to the node you are bootstrapping
  string target_node = 1;
  string ssh_key_path = 2;
  string ssh_user = 3;
  string ssh_port = 4;
}

message BootstrapNodeResponse {
  string id = 1;
  string target_node = 2;
  string status = 3;
  string summary = 4;
  google.protobuf.Timestamp timestamp = 5;
  uint64 duration_ms = 6;
}

// Fractal creation endpoint
message CreateFractalRequest {
  string prompt = 1;
  FractalRequirements requirements = 2;
  PromptContext context = 3;
}

message CreateFractalResponse {
  string task_id = 1;
  CosmicTaskStatus status = 2;
  string error = 3;
  google.protobuf.Timestamp created_at = 4;
}

// Prune endpoint
message PruneNodeRequest {
  bool force = 1;
  uint64 retain_after_timestamp = 2;
}

message PruneNodeResponse {
  bool success = 1;
  uint64 pruned_bytes = 2;
  uint64 pruned_entries = 3;
  string error = 4;
}

// Network topology endpoint
message GetTopologyRequest {}

message GetTopologyResponse {
  network.v1.NetworkTopology topology = 1;
  network.v1.NodeIdentity node_identity = 2;
}

// Route Metadata and Configuration
enum HttpMethod {
  HTTP_METHOD_UNSPECIFIED = 0;
  HTTP_METHOD_GET = 1;
  HTTP_METHOD_POST = 2;
  HTTP_METHOD_PUT = 3;
  HTTP_METHOD_DELETE = 4;
  HTTP_METHOD_PATCH = 5;
}

message RouteMetadata {
  string path = 1;
  string name = 2;
  HttpMethod method = 3;
  bool requires_auth = 4;
  string request_type = 5;  // Proto type URL (e.g., "ergors.orch.v1.HealthRequest")
  string response_type = 6; // Proto type URL (e.g., "ergors.orch.v1.HealthResponse")
  string description = 7;
}

message RouteRegistry {
  repeated RouteMetadata routes = 1;
}



// JSON structure for the api-keys.json file
message ApiKeysJson {
  ApiKeysMetadata metadata = 1;
  map<string, ProviderWithAuth> providers = 2;
  GlobalSettings global_settings = 3;
  Instructions instructions = 4;
}

message ApiKeysMetadata {
  string version = 1;
  string description = 2;
  string golden_ratio_note = 3;
}

/// Provider configuration with authentication
/// Combines LlmEntity (standard type) with api_key and prompt defaults
message ProviderWithAuth {
  string api_key = 1;
  LlmEntity entity = 2;
}

message GlobalSettings {
  int32 default_timeout_seconds = 1;
  int32 max_retry_attempts = 2;
  bool golden_ratio_weighting = 3;
  bool fallback_enabled = 4;
  int32 health_check_interval_seconds = 5;
}

message Instructions {
  repeated string setup = 1;
  repeated string security = 2;
}

// ========================================
// Deployment State Management Types
// ========================================

// Deployment type classification
enum DeploymentType {
  DEPLOYMENT_TYPE_UNSPECIFIED = 0;
  DEPLOYMENT_TYPE_NODE = 1; // Full ERGORS node deployment
  DEPLOYMENT_TYPE_LLM_INFERENCE = 2; // LLM inference provider endpoint
}

// Deployment status lifecycle
enum DeploymentStatus {
  DEPLOYMENT_STATUS_UNSPECIFIED = 0;
  DEPLOYMENT_STATUS_PENDING = 1;
  DEPLOYMENT_STATUS_PROVISIONING = 2;
  DEPLOYMENT_STATUS_DEPLOYING = 3;
  DEPLOYMENT_STATUS_RUNNING = 4;
  DEPLOYMENT_STATUS_UPDATING = 5;
  DEPLOYMENT_STATUS_STOPPING = 6;
  DEPLOYMENT_STATUS_STOPPED = 7;
  DEPLOYMENT_STATUS_FAILED = 8;
  DEPLOYMENT_STATUS_TERMINATED = 9;
}

// Runtime state for a deployment
message DeploymentState {
  string deployment_id = 1;
  DeploymentType deployment_type = 2;
  DeploymentStatus status = 3;
  BootstrapMethod bootstrap_method = 4;
  network.v1.NodeIdentity identity = 5;

  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
  google.protobuf.Timestamp started_at = 8;
  google.protobuf.Timestamp completed_at = 9;

  // Runtime information
  DeploymentRuntime runtime = 10;

  // Progress tracking
  repeated DeploymentEvent events = 11;

  // Resource tracking
  ResourceMetrics resources = 12;

  // Error information
  string error_message = 13;
  string error_trace = 14;
}

// Runtime information for active deployments
message DeploymentRuntime {
  // Network endpoints
  repeated string endpoints = 1;
  string api_endpoint = 2;
  string p2p_endpoint = 3;

  // Provider-specific data
  AkashRuntime akash = 4;

  // Health check data
  HealthCheckData health = 5;

  // Configuration
  map<string, string> env_vars = 6;
  string version = 7;

  // Additional provider runtimes
  Ec2Runtime ec2 = 8;
  PhalaRuntime phala = 9;
  WavsRuntime wavs = 10;
}

// Akash-specific runtime data
message AkashRuntime {
  string deployment_sequence = 1; // dseq
  string order_sequence = 2; // oseq
  string group_sequence = 3; // gseq
  string provider_address = 4;
  string lease_id = 5;
  repeated string service_endpoints = 6;
  uint64 lease_price_per_block = 7; // in uakt
  string provider_host_uri = 8;
}

// EC2-specific runtime data
message Ec2Runtime {
  string instance_id = 1;
  string public_ip = 2;
  string private_ip = 3;
  string availability_zone = 4;
  string instance_state = 5;
  string public_dns = 6;
}

// Phala-specific runtime data
message PhalaRuntime {
  string contract_id = 1;
  string cluster_id = 2;
  repeated string worker_endpoints = 3;
  string attestation_report = 4;
}

// WAVS-specific runtime data
message WavsRuntime {
  string component_id = 1;
  string trigger_id = 2;
  repeated string service_endpoints = 3;
}

// Health check information
message HealthCheckData {
  bool is_healthy = 1;
  string last_check_time = 2;
  uint32 consecutive_failures = 3;
  string health_endpoint = 4;
}

// Deployment event for audit trail
message DeploymentEvent {
  google.protobuf.Timestamp timestamp = 1;
  DeploymentStatus status = 2;
  string message = 3;
  string metadata_json = 4;
}

// Resource metrics for deployments
message ResourceMetrics {
  uint32 cpu_millicores = 1;
  uint64 memory_bytes = 2;
  uint64 storage_bytes = 3;
  uint32 bandwidth_mbps = 4;
  double cost_per_hour = 5;
}

// Request to deploy multiple resources in parallel
message DeployBatchRequest {
  repeated DeploymentSpec deployments = 1;
  bool wait_for_completion = 2;
  uint32 timeout_seconds = 3;
}

// Specification for a single deployment
message DeploymentSpec {
  string name = 1;
  DeploymentType deployment_type = 2;
  BootstrapMethod bootstrap_method = 3;
  network.v1.NodeIdentity identity = 4;
  LlmEntity llm_config = 5; // For LLM inference deployments
  map<string, string> labels = 6; // Arbitrary labels for organization
}

// Response for batch deployment
message DeployBatchResponse {
  repeated DeploymentState deployments = 1;
  uint32 successful = 2;
  uint32 failed = 3;
  uint32 pending = 4;
}

// Query deployment state
message QueryDeploymentRequest {
  string deployment_id = 1;
  DeploymentType deployment_type = 2;
  DeploymentStatus status = 3;
  uint32 limit = 4;
}

message QueryDeploymentResponse {
  repeated DeploymentState deployments = 1;
  uint32 total_count = 2;
}

// Update deployment
message UpdateDeploymentRequest {
  string deployment_id = 1;
  DeploymentStatus target_status = 2; // For stop/start operations
   map<string, string> env_vars = 3; // Update environment variables
}

message UpdateDeploymentResponse {
  DeploymentState deployment = 1;
  bool success = 2;
  string message = 3;
}

// ========================================
// Akash Deployment Workflow Types
// ========================================

// Encrypted cosmos mnemonic stored in Cnidarium
// Uses same encryption pattern as EncryptedNodeIdentity
message EncryptedCosmosMnemonic {
  string key_name = 1;
  bytes encrypted_mnemonic = 2;
  bytes nonce = 3;
  bytes kdf_salt = 4;
  string kdf_params = 5;
  string encryption_method = 6;
  string chain_id = 7;
  string address_prefix = 8;
  string default_hd_path = 9;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp last_used_at = 11;
  uint32 version = 12;
  // Human-readable label for this key (e.g. "my-akash-deployer")
  string label = 13;
  // Whether this is the default funding key for deployments
  bool is_default = 14;
}

// Derived account from HD path (non-sensitive)
message CosmosAccount {
  string key_name = 1;
  string hd_path = 2;
  string address = 3;
  bytes public_key = 4;
  uint32 account_index = 5;
}

// Collection of encrypted cosmos keys stored in Cnidarium
message CosmosKeyStore {
  uint32 version = 1;
  repeated EncryptedCosmosMnemonic keys = 2;
  repeated CosmosAccount derived_accounts = 3;
  google.protobuf.Timestamp updated_at = 4;
  // Name of the default key for auto-selection during deployments
  string default_key_name = 5;
}

// Configuration for Akash network deployment endpoints
message AkashDeployConfig {
  // Chain ID (e.g. "akashnet-2" for mainnet, "local" for dev)
  string chain_id = 3;
  // Gas prices (e.g. "0.0025uakt")
  string gas_prices = 4;
  // Gas adjustment multiplier (e.g. 1.3)
  double gas_adjustment = 5;
  // Keyring backend (e.g. "os", "file", "test")
  string keyring_backend = 6;
  // Default key name to use for deployments
  string default_key_name = 7;
  // Trusted provider addresses (optional whitelist)
  repeated string trusted_providers = 8;
  // REST/LCD endpoint for queries (e.g. "https://rest-akash.ecostake.com")
  // Multiple RPC endpoints for automatic failover (preferred over rpc_endpoint)
  repeated string rpc_endpoints = 10;
  // Multiple gRPC endpoints for automatic failover (preferred over grpc_endpoint)
  repeated string grpc_endpoints = 11;
  // Multiple REST/LCD endpoints for automatic failover (preferred over rest_endpoint)
  repeated string rest_endpoints = 12;

  // Maximum retry attempts per endpoint before moving to next (default: 2)
  uint32 max_retries_per_endpoint = 13;
  // Total maximum retry attempts across all endpoints (default: 6)
  uint32 max_total_retries = 14;
  // Timeout in seconds for each connection attempt (default: 10)
  uint32 connection_timeout_seconds = 15;
}

// ==============================================
// Proxy Router Configuration (Immutable Audit Log)
// ==============================================

// Configuration for dynamic LLM proxy routing
// Stored in cnidarium for deterministic, immutable logging of endpoint changes
message ProxyRouterConfig {
  // Override base URL for Ollama API requests
  string ollama_base_url = 3 [deprecated = true];
  // Model-specific routing rules (glob patterns -> provider IDs)
  // e.g., "claude-*" -> "anthropic"
  // e.g., "llama-*" -> "local-ollama"
  // e.g., "grok-*" -> "my-grok-provider"
  map<string, string> model_routes = 4;
  // Timestamp when this config was set/updated
  google.protobuf.Timestamp updated_at = 7;
  // Version number for this configuration (increments on each update)
  uint64 version = 8;
  // Optional description/reason for this configuration change
  string change_reason = 9;

  // Generic provider configurations (replaces deprecated fields)
  // Key is provider_id (e.g., "openai", "anthropic", "my-custom-provider")
  // This is the NEW preferred way to configure inference providers
  map<string, InferenceProviderConfig> providers = 10;
}

// Generic inference provider configuration
// Supports any provider (OpenAI, Anthropic, Ollama, custom, etc.)
message InferenceProviderConfig {
  // Unique identifier for this provider (e.g., "openai", "my-grok", "local-ollama")
  string provider_id = 1;

  // Base URL for API requests (e.g., "https://api.openai.com", "http://localhost:11434")
  string base_url = 2;

  // API key for authentication (stored as plaintext reference or encrypted blob)
  // For custody-managed keys, use api_key_ref instead
  string api_key = 3;

  // Reference to a custody-managed API key (alternative to api_key)
  // Format: "custody://{key_id}" or "env://{ENV_VAR_NAME}"
  string api_key_ref = 4;

  // Provider type hint for protocol compatibility
  InferenceProviderType provider_type = 5;

  // Whether this provider is currently enabled
  bool enabled = 6;

  // Optional display name for UI/logs
  string display_name = 7;

  // Optional description of this provider instance
  string description = 8;

  // Extensible metadata for provider-specific config
  map<string, string> metadata = 9;

  // Maximum concurrent requests to this provider (0 = unlimited)
  uint32 max_concurrent_requests = 10;

  // Request timeout in seconds (0 = use default)
  uint32 timeout_seconds = 11;

  // Created timestamp
  google.protobuf.Timestamp created_at = 12;

  // Last updated timestamp
  google.protobuf.Timestamp updated_at = 13;
}

// Provider type enumeration for protocol compatibility
enum InferenceProviderType {
  INFERENCE_PROVIDER_TYPE_UNSPECIFIED = 0;
  INFERENCE_PROVIDER_TYPE_ANTHROPIC = 1;   // Claude API protocol
  INFERENCE_PROVIDER_TYPE_OPENAI = 2;      // OpenAI API protocol
  INFERENCE_PROVIDER_TYPE_OLLAMA = 3;      // Ollama API protocol
  INFERENCE_PROVIDER_TYPE_TGI = 4;         // HuggingFace TGI protocol
  INFERENCE_PROVIDER_TYPE_VLLM = 5;        // vLLM API protocol
  INFERENCE_PROVIDER_TYPE_CUSTOM = 99;     // Custom/unknown protocol
}

// Workflow step enumeration for Akash deployment wizard
// NOTE: Step ordering is handled in code, not by enum values.
// CONNECTIVITY_CHECK runs first regardless of its numeric value.
enum AkashWorkflowStep {
  AKASH_WORKFLOW_STEP_UNSPECIFIED = 0;
  AKASH_WORKFLOW_STEP_KEY_SELECTION = 1;
  AKASH_WORKFLOW_STEP_BALANCE_CHECK = 2;
  AKASH_WORKFLOW_STEP_GRANT_REQUEST = 3;      // OPTIONAL: Request authz/feegrant (only if --request-grant-from)
  AKASH_WORKFLOW_STEP_GRANT_WAIT = 4;         // OPTIONAL: Wait for grant approval (follows GRANT_REQUEST)
  AKASH_WORKFLOW_STEP_SDL_CONFIGURATION = 7;
  AKASH_WORKFLOW_STEP_CERTIFICATE_SETUP = 8;
  AKASH_WORKFLOW_STEP_DEPLOYMENT_CREATE = 9;
  AKASH_WORKFLOW_STEP_BID_WAIT = 10;
  AKASH_WORKFLOW_STEP_PROVIDER_SELECTION = 11;
  AKASH_WORKFLOW_STEP_LEASE_CREATE = 12;
  AKASH_WORKFLOW_STEP_MANIFEST_SEND = 13;
  AKASH_WORKFLOW_STEP_ENDPOINT_RETRIEVAL = 14;
  AKASH_WORKFLOW_STEP_COMPLETE = 16;
  AKASH_WORKFLOW_STEP_FAILED = 17;
  AKASH_WORKFLOW_STEP_CONNECTIVITY_CHECK = 18; // NEW: Verify Akash network reachable (runs first)
}

// Workflow status
enum AkashWorkflowStatus {
  AKASH_WORKFLOW_STATUS_UNSPECIFIED = 0;
  AKASH_WORKFLOW_STATUS_PENDING = 1;
  AKASH_WORKFLOW_STATUS_RUNNING = 2;
  AKASH_WORKFLOW_STATUS_PAUSED = 3;
  AKASH_WORKFLOW_STATUS_COMPLETED = 4;
  AKASH_WORKFLOW_STATUS_FAILED = 5;
  AKASH_WORKFLOW_STATUS_CANCELLED = 6;
}

// Authz grant tracking for workflow permissions
message AkashAuthzGrant {
  string granter = 1;
  string grantee = 2;
  repeated string msg_type_urls = 3;
  google.protobuf.Timestamp expiration = 4;
  string grant_tx_hash = 5;
  bool active = 6;
}

// Feegrant allowance tracking
message AkashFeegrantAllowance {
  string granter = 1;
  string grantee = 2;
  uint64 spend_limit_uakt = 3;
  uint64 spent_uakt = 4;
  google.protobuf.Timestamp expiration = 5;
  repeated string allowed_messages = 6;
  string grant_tx_hash = 7;
  bool active = 8;
}

// SDL template variable
message SdlVariable {
  string name = 1;
  string description = 2;
  string default_value = 3;
  string var_type = 4;
  bool required = 5;
}

// Configured SDL ready for deployment
message ConfiguredSdl {
  string template_name = 1;
  string resolved_content = 2;
  map<string, string> variable_values = 3;
  bytes content_hash = 4;
  google.protobuf.Timestamp configured_at = 5;
}

// Provider selection info
message AkashProviderSelection {
  string provider_address = 1;
  uint32 reputation_score = 2;
  uint64 bid_price_uakt = 3;
  uint32 total_bids_received = 4;
  google.protobuf.Timestamp selected_at = 5;
  bool is_trusted_provider = 6;
}

// Endpoint test result
message EndpointTestResult {
  string service_name = 1;
  string endpoint_uri = 2;
  bool success = 3;
  uint64 response_time_ms = 4;
  string test_type = 5;
  string error_message = 6;
  google.protobuf.Timestamp tested_at = 7;
}

// Main Akash deployment workflow state
message AkashDeploymentWorkflow {
  string session_id = 1;
  AkashWorkflowStep current_step = 2;
  AkashWorkflowStatus status = 3;

  // Key management
  string selected_key_name = 4;
  string account_address = 5;
  uint32 hd_account_index = 6;

  // Permission state
  repeated AkashAuthzGrant authz_grants = 7;
  repeated AkashFeegrantAllowance feegrants = 8;

  // SDL configuration
  ConfiguredSdl configured_sdl = 9;

  // Deployment state (uses existing AkashRuntime)
  AkashRuntime deployment = 10;
  AkashProviderSelection provider = 11;

  // Retrieved endpoints
  map<string, string> endpoints = 12;

  // Test results
  repeated EndpointTestResult test_results = 13;

  // Error tracking
  string last_error = 14;
  uint32 retry_count = 15;

  // Timestamps
  google.protobuf.Timestamp created_at = 16;
  google.protobuf.Timestamp updated_at = 17;
  google.protobuf.Timestamp completed_at = 18;

  // Chain configuration
  string chain_id = 19;
  string node_endpoint = 20;

  // Workflow configuration
  uint32 max_retries = 21;
  uint64 timeout_seconds = 22;

  // Grant request state (for GRANT_REQUEST/GRANT_WAIT steps)
  WorkflowGrantState grant_request = 23;

  // Grant request configuration (from CLI flags)
  bytes request_grant_from = 24;     // Granter's node pubkey
  uint64 grant_duration_seconds = 25;
  uint64 grant_spend_limit_uakt = 26;
  string grant_purpose = 27;

  // ===== Automated Workflow Fields (tags 30+) =====

  // Bids received during BidWait step
  repeated AkashBidInfo available_bids = 30;

  // Certificate from chain (official akash.cert.v1.Certificate type)
  akash.cert.v1.Certificate certificate = 31;

  // Encrypted private key for mTLS (ChaCha20Poly1305 encrypted)
  // Decrypted only when needed for provider communication
  bytes encrypted_cert_private_key = 36;

  // Lease ID after lease creation
  AkashLeaseIdInfo lease_id_info = 32;

  // Workflow automation options
  AkashWorkflowOptions options = 33;

  // Service endpoints with port mappings (after manifest send)
  repeated AkashServiceEndpoint service_endpoints = 34;

    // User-defined label for easy access (e.g., "embeddings-model", "inference-gpu")
  // Must be unique across active deployments for O(1) label lookups
  string label = 35;

  // reserved 36 = encrypted_cert_private_key (defined above)

  // Actual model name for inference routing (e.g., "Qwen/Qwen3-235B-A22B-FP8")
  // Stamped onto service endpoints when they are discovered
  string model_name = 37;
}

// Workflow step log entry for audit
message AkashWorkflowStepLog {
  string session_id = 1;
  AkashWorkflowStep step = 2;
  bool success = 3;
  uint64 duration_ms = 4;
  string message = 5;
  string tx_hash = 6;
  string error = 7;
  google.protobuf.Timestamp timestamp = 8;
}

// Provider reputation record
message AkashProviderReputation {
  string provider_address = 1;
  uint32 score = 2;
  uint64 successful_deployments = 3;
  uint64 failed_deployments = 4;
  uint32 avg_uptime_percent = 5;
  uint64 avg_response_time_ms = 6;
  bool is_trusted = 7;
  google.protobuf.Timestamp updated_at = 8;
}

// ========================================
// Automated Workflow Types
// ========================================

// Bid info stored during workflow (mirrors cosmos_client::BidInfo)
message AkashBidInfo {
  string owner = 1;
  uint64 dseq = 2;
  uint32 gseq = 3;
  uint32 oseq = 4;
  string provider = 5;
  string price_denom = 6;
  string price_amount = 7;
  AkashBidState state = 8;
  int64 created_at = 9;
}

// Bid state enum
enum AkashBidState {
  AKASH_BID_STATE_INVALID = 0;
  AKASH_BID_STATE_OPEN = 1;
  AKASH_BID_STATE_ACTIVE = 2;
  AKASH_BID_STATE_LOST = 3;
  AKASH_BID_STATE_CLOSED = 4;
}

// NOTE: Using official akash.cert.v1.Certificate type instead of custom wrapper
// Private key is stored encrypted in AkashDeploymentWorkflow.encrypted_cert_private_key

// Lease ID info stored after lease creation
message AkashLeaseIdInfo {
  string owner = 1;
  uint64 dseq = 2;
  uint32 gseq = 3;
  uint32 oseq = 4;
  string provider = 5;
}

// Lease info with full state (mirrors cosmos_client::LeaseInfo)
message AkashLeaseInfo {
  string owner = 1;
  uint64 dseq = 2;
  uint32 gseq = 3;
  uint32 oseq = 4;
  string provider = 5;
  AkashLeaseState state = 6;
  string price_denom = 7;
  string price_amount = 8;
  int64 created_at = 9;
  int64 closed_on = 10;
}

// Lease state enum
enum AkashLeaseState {
  AKASH_LEASE_STATE_INVALID = 0;
  AKASH_LEASE_STATE_ACTIVE = 1;
  AKASH_LEASE_STATE_INSUFFICIENT_FUNDS = 2;
  AKASH_LEASE_STATE_CLOSED = 3;
}

// Workflow automation options (from CLI flags)
message AkashWorkflowOptions {
  // Minimum balance required to proceed (uakt)
  uint64 min_balance_uakt = 3;
  // Blocks to wait for bids (default: 2)
  uint32 bid_wait_blocks = 4;
  // Filter bids by these providers (empty = all providers)
  repeated string trusted_providers = 5;
  // Maximum retries on transient failures
  uint32 max_retries = 6;

  // NEW: Prompt user for bid selection instead of auto-selecting cheapest
  bool interactive_bid = 7;
  // NEW: Request grant from this node (bech32 ergo1... address). Empty = no grant request.
  string request_grant_from = 8;
  // NEW: Grant duration in seconds (default: 86400 = 24h)
  uint64 grant_duration_seconds = 9;
  // NEW: Grant spend limit in uakt (default: 5000000 = 5 AKT)
  uint64 grant_spend_limit_uakt = 10;
}

// Service endpoint with port mapping (after manifest send)
message AkashServiceEndpoint {
  string service_name = 1;
  string external_uri = 2;
  uint32 internal_port = 3;
  uint32 external_port = 4;
  string protocol = 5;  // "tcp", "udp", "http"
  string model_name = 6; // Actual model name for inference routing (e.g., "Qwen/Qwen3-235B-A22B-FP8")
}

// Trusted provider entry stored in Cnidarium
message TrustedProvider {
  string address = 1;
  string label = 2;
  google.protobuf.Timestamp added_at = 3;
}

// Collection of trusted providers
message TrustedProviderList {
  repeated TrustedProvider providers = 1;
  google.protobuf.Timestamp updated_at = 2;
}

// ========================================
// Workflow Control RPC Messages
// ========================================

// Request to run automated deployment workflow
message RunAkashDeploymentRequest {
  string session_id = 1;
  AkashWorkflowOptions options = 2;
  // Password to unlock Cosmos key manager for transaction signing
  string key_password = 3;
}

// Response from running deployment workflow
message RunAkashDeploymentResponse {
  AkashDeploymentWorkflow workflow = 1;
  bool completed = 2;
  // If not completed, what input is needed
  WorkflowInputRequired input_required = 3;
}

// What input the workflow needs to continue
message WorkflowInputRequired {
  WorkflowInputType input_type = 1;
  // For BID_SELECTION: available bids
  repeated AkashBidInfo available_bids = 2;
  // For GRANT_APPROVAL: grant request details
  WorkflowGrantState grant_request = 3;
  string message = 4;
}

// Types of input the workflow might require
enum WorkflowInputType {
  WORKFLOW_INPUT_TYPE_UNSPECIFIED = 0;
  WORKFLOW_INPUT_TYPE_BID_SELECTION = 1;
  WORKFLOW_INPUT_TYPE_GRANT_APPROVAL = 2;
  WORKFLOW_INPUT_TYPE_SDL_CONFIGURATION = 3;
}

// Request to get bids for a deployment
message GetAkashBidsRequest {
  string session_id = 1;
  bool trusted_only = 2;
}

// Response with available bids
message GetAkashBidsResponse {
  repeated AkashBidInfo bids = 1;
  uint64 dseq = 2;
}

// Request to select a bid and create lease
message SelectAkashBidRequest {
  string session_id = 1;
  string provider_address = 2;
}

// Request to close an active lease
message CloseAkashLeaseRequest {
  string session_id = 1;
}

// Request to close a deployment (also closes any leases)
message CloseAkashDeploymentRequest {
  string session_id = 1;
}

// Request to update a deployment with new SDL
message UpdateAkashDeploymentRequest {
  string session_id = 1;
  string sdl_content = 2;
}

// Request to top up escrow account for a deployment
message TopupAkashEscrowRequest {
  string session_id = 1;
  uint64 amount_uakt = 2;
}

// Request to get lease status
message GetLeaseStatusRequest {
  string session_id = 1;
}

// Response with lease status
message LeaseStatusResponse {
  AkashLeaseInfo lease = 1;
  repeated AkashServiceEndpoint endpoints = 2;
  uint64 balance_remaining_uakt = 3;
  string deployment_status = 4;
}

// Request to add a trusted provider
message AddTrustedProviderRequest {
  string address = 1;
  string label = 2;
}

// Request to remove a trusted provider
message RemoveTrustedProviderRequest {
  string address = 1;
}

// Request to list trusted providers
message ListTrustedProvidersRequest {}

// Response with trusted providers
message ListTrustedProvidersResponse {
  repeated TrustedProvider providers = 1;
}

// Generic operation result
message OperationResult {
  bool success = 1;
  string message = 2;
  string tx_hash = 3;
}

// ========================================
// Akash Certificate Management Types
// ========================================

// Request to create a new mTLS certificate
message CreateAkashCertificateRequest {
  string key_name = 1;
  uint32 account_index = 2;
}

// Response from certificate creation
message CreateAkashCertificateResponse {
  bool success = 1;
  string tx_hash = 2;
  string serial = 3;
  string error_message = 4;
}

// Request to revoke a certificate
message RevokeAkashCertificateRequest {
  string key_name = 1;
  uint32 account_index = 2;
  string serial = 3;  // If empty, revokes first valid cert
}

// Request to list certificates from chain
message ListAkashCertificatesRequest {
  string key_name = 1;
  uint32 account_index = 2;
  string address = 3;  // Optional override
}

// Certificate info for display
message AkashCertificateInfo {
  string serial = 1;
  string state = 2;  // "valid", "revoked"
  bool has_stored_key = 3;  // Whether we have the private key stored
}

// Response with certificates
message ListAkashCertificatesResponse {
  repeated AkashCertificateInfo certificates = 1;
  string address = 2;  // The queried address
}

// Stored certificate entry with encrypted private key
message StoredAkashCertificate {
  string label = 1;              // Human-readable label (e.g., "primary", "backup")
  string serial = 2;             // Certificate serial from chain
  string owner_address = 3;      // Akash address that owns this cert
  bytes encrypted_private_key = 4;  // ChaCha20Poly1305 encrypted private key
  google.protobuf.Timestamp created_at = 5;
}

// Certificate store with multiple certificates and default selection
message AkashCertificateStore {
  repeated StoredAkashCertificate certificates = 1;
  uint32 default_index = 2;      // Index of default certificate (0-based)
  google.protobuf.Timestamp updated_at = 3;
}

// ========================================
// Grant Request System Types
// ========================================

// Type of grant being requested
enum GrantType {
  GRANT_TYPE_UNSPECIFIED = 0;
  GRANT_TYPE_AUTHZ_ONLY = 1;        // Only authz permissions
  GRANT_TYPE_FEEGRANT_ONLY = 2;     // Only feegrant allowance
  GRANT_TYPE_AUTHZ_AND_FEEGRANT = 3; // Both authz and feegrant
}

// Status of a grant request
enum GrantRequestStatus {
  GRANT_REQUEST_STATUS_UNSPECIFIED = 0;
  GRANT_REQUEST_STATUS_PENDING = 1;      // Waiting for granter approval
  GRANT_REQUEST_STATUS_APPROVED = 2;     // Approved, waiting for broadcast
  GRANT_REQUEST_STATUS_BROADCASTED = 3;  // Grant tx broadcasted
  GRANT_REQUEST_STATUS_CONFIRMED = 4;    // Confirmed on-chain
  GRANT_REQUEST_STATUS_REJECTED = 5;     // Rejected by granter
  GRANT_REQUEST_STATUS_CANCELLED = 6;    // Cancelled by requester
  GRANT_REQUEST_STATUS_EXPIRED = 7;      // Expired before approval
}

// Granter's acceptance mode for incoming requests
enum GrantAcceptanceMode {
  GRANT_ACCEPTANCE_MODE_UNSPECIFIED = 0;
  GRANT_ACCEPTANCE_MODE_ACCEPT_ALL = 1;  // Auto-approve all requests
  GRANT_ACCEPTANCE_MODE_REJECT_ALL = 2;  // Reject all requests
  GRANT_ACCEPTANCE_MODE_WHITELIST = 3;   // Only approve whitelisted requesters
  GRANT_ACCEPTANCE_MODE_MANUAL = 4;      // Require manual approval
}

// Default parameters for grants a granter will issue
message GrantDefaults {
  uint64 max_duration_seconds = 1;
  uint64 max_spend_limit_uakt = 2;
  repeated string allowed_msg_types = 3;
  uint64 auto_approve_delay_seconds = 4;
}

// Custom limits for a specific whitelisted requester
message GrantLimits {
  uint64 max_duration_seconds = 1;
  uint64 max_spend_limit_uakt = 2;
  uint32 max_concurrent_grants = 3;
}

// Parameters for a grant request
message GrantRequestParams {
  uint64 duration_seconds = 1;
  uint64 spend_limit_uakt = 2;
  repeated string msg_types = 3;
  string purpose = 4;  // Reason for the grant request
}

// A grant request submitted to the contract
message GrantRequest {
  uint64 id = 1;
  bytes requester_pubkey = 2;
  string grantee_address = 3;
  bytes granter_pubkey = 4;
  string granter_address = 5;
  GrantType grant_type = 6;
  GrantRequestParams params = 7;
  GrantRequestStatus status = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
  string tx_hash = 11;
  string rejection_reason = 12;
}

// Information about a registered granter
message GranterInfo {
  bytes node_pubkey = 1;
  string granter_address = 2;
  GrantAcceptanceMode mode = 3;
  GrantDefaults defaults = 4;
  uint32 active_grants = 5;
  uint64 total_granted_uakt = 6;
  google.protobuf.Timestamp registered_at = 7;
}

// Whitelist entry for a granter
message WhitelistEntry {
  bytes requester_pubkey = 1;
  GrantLimits custom_limits = 2;
  string note = 3;
  google.protobuf.Timestamp added_at = 4;
}

// Granter configuration stored in node config
message GranterConfig {
  bool enabled = 1;
  GrantAcceptanceMode mode = 2;
  string contract_address = 3;
  GrantDefaults defaults = 4;
  repeated WhitelistEntry whitelist = 5;
}

// Workflow grant request state (used during deployment)
message WorkflowGrantState {
  uint64 request_id = 1;
  bytes granter_pubkey = 2;
  string granter_address = 3;
  GrantType grant_type = 4;
  GrantRequestParams params = 5;
  GrantRequestStatus status = 6;
  google.protobuf.Timestamp submitted_at = 7;
  string tx_hash = 8;
  string rejection_reason = 9;
}

// ========================================
// Key Sharing Types (defined in network/v1/network.proto)
// ========================================
// The following types are imported from network.v1:
// - KeySharingMode, SecretSharingConfig, SecretShare
// - IdentityChallenge, IdentityChallengeResponse
// - ProviderOwnership, ProviderSharingConfig

// ========================================
// CosmWasm Custom Authenticator Types
// ========================================

// Entry representing an authenticator registration
message AuthenticatorEntry {
  // The endpoint label this authenticator is registered for
  string endpoint_label = 1;
  // The CosmWasm contract address that handles authorization
  string contract_address = 2;
  // Human-readable description of this authenticator
  string description = 3;
  // When the authenticator was registered
  google.protobuf.Timestamp created_at = 4;
  // Whether the authenticator is currently active
  bool active = 5;
}

// Request to register an authenticator for an endpoint
message RegisterAuthenticatorRequest {
  // The endpoint label to protect (e.g., "api/prompts", "orchestrate/fractal")
  string endpoint_label = 1;
  // The CosmWasm contract address that will handle authorization
  string contract_address = 2;
  // Optional description of this authenticator
  string description = 3;
}

// Response from registering an authenticator
message RegisterAuthenticatorResponse {
  bool success = 1;
  string message = 2;
  AuthenticatorEntry entry = 3;
}

// Request to list all registered authenticators
message ListAuthenticatorsRequest {
  // Optional filter by endpoint label prefix
  string endpoint_prefix = 1;
  // Pagination limit
  uint32 limit = 2;
  // Pagination offset
  uint32 offset = 3;
}

// Response listing all registered authenticators
message ListAuthenticatorsResponse {
  repeated AuthenticatorEntry authenticators = 1;
  uint32 total_count = 2;
}

// Request to remove an authenticator
message DeleteAuthenticatorRequest {
  // The endpoint label to remove the authenticator from
  string endpoint_label = 1;
}

// Response from deleting an authenticator
message DeleteAuthenticatorResponse {
  bool success = 1;
  string message = 2;
}

// Query for checking if an address is authorized for an endpoint
message AuthorizationCheckRequest {
  // The endpoint label to check
  string endpoint_label = 1;
  // The address/pubkey to check authorization for
  string address = 2;
}

// Response from authorization check
message AuthorizationCheckResponse {
  bool authorized = 1;
  string reason = 2;
  string authenticator_contract = 3;
}

// ========================================
// Authenticator Contract Message Types
// These are JSON messages sent to/from CosmWasm contracts
// Documented here for reference but used as serde structs in Rust
// ========================================

// Query message for auth_registry_updater contract
// JSON: {"is_authorized": {"address": "ergors{node_id}_{pubkey_hash}"}}
// Response: {"authorized": true|false}

// Query message for whitelist_authenticator contract
// JSON: {"is_allowed": {"address": "ergors{node_id}_{pubkey_hash}"}}
// Response: {"allowed": true|false}

// Execute message for whitelist_authenticator contract
// JSON: {"add_address": {"address": "ergors{node_id}_{pubkey_hash}"}}
// JSON: {"remove_address": {"address": "ergors{node_id}_{pubkey_hash}"}}

// ========================================
// RAG Vector Database Types
// ========================================

// Ingest document request
message RagIngestRequest {
  string content = 1;
  string uri = 2;
  string doc_type = 3;
  repeated string tags = 4;
}

// Ingest document response
message RagIngestResponse {
  bool success = 1;
  uint32 chunk_count = 2;
  repeated string chunk_ids = 3;
  string message = 4;
}

// Query vector database request
message RagQueryRequest {
  string query = 1;
  uint32 top_k = 2;
  bool verify = 3;
}

// Single search result
message RagSearchResult {
  string chunk_id = 1;
  float similarity = 2;
  string content_preview = 3;
  string source_uri = 4;
}

// Query response
message RagQueryResponse {
  repeated RagSearchResult results = 1;
  bool verified = 2;
}

// RAG status request
message RagStatusRequest {}

// RAG status response
message RagStatusResponse {
  uint64 total_chunks = 1;
  uint64 total_sources = 2;
  bool embedder_configured = 3;
  string embedder_endpoint = 4;
  string embedder_model = 5;
  uint32 embedding_dimension = 6;
}

// Delete chunks by source request
message RagDeleteRequest {
  string source_uri = 1;
}

// Source info for listing
message RagSourceInfo {
  string uri = 1;
  uint32 chunk_count = 2;
  string doc_type = 3;
  string ingested_at = 4;
}

// List sources request
message RagListSourcesRequest {
  uint32 limit = 1;
}

// List sources response
message RagListSourcesResponse {
  repeated RagSourceInfo sources = 1;
  uint32 total_count = 2;
}

// Configure embedder request
message RagConfigureRequest {
  string endpoint = 1;
  string model = 2;
  uint32 dimension = 3;
}

// Generic RAG operation result
message RagOperationResult {
  bool success = 1;
  string message = 2;
}

// ========================================
// RLM (Recursive Language Model) Types
// ========================================

// Request to get documents for RLM execution
message GetDocumentsRequest {
  string source_uri_prefix = 1;  // "discord:guild_{id}/"
  uint32 limit = 2;
}

// Document for RLM context
message Document {
  string source_uri = 1;
  string content = 2;
  string doc_type = 3;
  repeated string tags = 4;
  int64 ingested_at = 5;
}

// Response with documents
message GetDocumentsResponse {
  repeated Document documents = 1;
}

// Request to execute RLM query
message RlmQueryRequest {
  string query = 1;
  string guild_id = 2;
  uint32 max_iterations = 3;
  uint32 max_sub_calls = 4;
  repeated string allowed_models = 5;
}

// Response from RLM execution
message RlmQueryResponse {
  string answer = 1;
  repeated string source_uris = 2;
  uint32 iterations = 3;
  uint32 sub_llm_calls = 4;
  double cost_usd = 5;
  uint64 latency_ms = 6;
}

// ========================================
// Generic Inbox Types
// ========================================

// Status of an inbox message
enum InboxMessageStatus {
  INBOX_MESSAGE_STATUS_UNSPECIFIED = 0;
  INBOX_MESSAGE_STATUS_PENDING = 1;
  INBOX_MESSAGE_STATUS_ACCEPTED = 2;
  INBOX_MESSAGE_STATUS_REJECTED = 3;
  INBOX_MESSAGE_STATUS_EXPIRED = 4;
}

// A generic inbox message representing an action request between nodes
message InboxMessage {
  uint64 id = 1;
  // Action type identifier (e.g. "grant_request", "bootstrap", "deploy")
  string action_type = 2;
  // Sender node identity
  bytes sender_pubkey = 3;
  // Proto type URL for the payload (e.g. "/ergors.orch.v1.GrantRequest")
  string payload_type_url = 4;
  // Serialized proto payload bytes
  bytes payload = 5;
  // Current status
  InboxMessageStatus status = 6;
  // Human-readable summary for inbox display
  string summary = 7;
  // Reason for rejection (if rejected)
  string rejection_reason = 8;
  // Result data from accepted action (if any)
  string result = 9;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp updated_at = 11;
}

