[package]
name = "ergors-tests"
version = "0.1.0"
edition = "2021"
authors = ["ERGORS Contributors"]
description = "Modular integration test suite for ERGORS"
license = "MIT OR Apache-2.0"

[features]
default = []
e2e = []           # Full end-to-end tests
mock-only = []     # Tests using only mocks
integration = []   # Cross-component tests

[dependencies]
# Workspace dependencies
ho-std = { workspace = true, features = ["grpc-transport", "cw", "rpc"] }
anyhow = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
tempfile = { workspace = true }
proptest = { workspace = true }
assert_cmd = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
hex = { workspace = true }
toml = { workspace = true }

# Additional test dependencies
tokio-test = "0.4"
pbjson-types = { workspace = true }
camino = { workspace = true }
rand = { workspace = true }

# Integration test dependencies - real node engine components
ergors = { path = "../packages/ergors", features = ["cw"] }
akash-deploy = { path = "../packages/akash-deploy" }
cnidarium = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
