# Test template for ProxyConfig with providers
enabled = true
bind_addr = "127.0.0.1:9090"

[router]
version = 1
change_reason = "test configuration with providers"

[router.model_routes]
"llama-*" = "local-ollama"

[router.providers.anthropic]
provider_id = "anthropic"
base_url = "https://custom.anthropic.com"
api_key_ref = ""
enabled = true
provider_type = 1
display_name = ""
description = ""
max_concurrent_requests = 0
timeout_seconds = 0

[router.providers.anthropic.metadata]

[router.providers.local-ollama]
provider_id = "local-ollama"
base_url = "http://localhost:11434"
api_key_ref = ""
enabled = true
provider_type = 3
display_name = ""
description = ""
max_concurrent_requests = 0
timeout_seconds = 0

[router.providers.local-ollama.metadata]

[capture]
enabled = true
include_chunks = false
max_sessions = 1000
retention_seconds = 86400
