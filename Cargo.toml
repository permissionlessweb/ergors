cosmwasm-vm = { version = "3.0.1", features = ["stargate"] }
decaf377                         = { default-features = false, version = "0.10.1" }
decaf377-fmd                     = { version = "2.1.0" }
decaf377-ka                     = { version = "2.1.0" }
decaf377-rdsa                    = { version = "0.11.0" }
derivative                       = { version = "2.2" }
directories = "5"
